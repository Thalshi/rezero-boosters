<title>Re Zéro : LoL · Boosters</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Même interface que Kyara (couleurs, polices, pilules, cartes), avec l'univers de Re Zéro : LoL. */
:root {
  --bg: #0e0d12; --bg2: #121117; --panel: #15141a; --panel2: #17161d; --raise: #1e1c26;
  --line: #25232c; --line2: #2e2b36; --line3: #3a3742;
  --fg: #edeae4; --fg2: #b7b2bd; --fg3: #c9c5ce; --mut: #8a8590; --dim: #5a5662;
  --acc: #ff4d2e; --acc2: #ff6a4d; --acc-soft: #ff4d2e1f;
  --cyan: #4dd6ff; --gold: #f5c518; --gold-soft: #f5c5181f; --wish: #ff4d9e; --ok: #3fbf7f; --warn: #ffb347; --danger: #ff5c5c;
  --r-c: #b5b1bb; --r-pc: #3fbf7f; --r-r: #4d9bff; --r-e: #b072ff; --r-l: #f5c518; --r-m: #ff4d2e;
  --disp: "Unbounded", system-ui, sans-serif; --body: "Zen Kaku Gothic New", system-ui, sans-serif; --mono: "JetBrains Mono", ui-monospace, monospace;
  --r-sm: 6px; --r-md: 10px; --r-lg: 14px; --r-xl: 18px;
  --sh-1: 0 6px 14px #00000073; --sh-2: 0 18px 40px #0000008c;
  --g: 16px;
  color-scheme: dark;
}
@media (min-width: 900px) { :root { --g: 32px; } }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { background: var(--bg); }
body { margin: 0; background: var(--bg); color: var(--fg); font: 400 16px/1.6 var(--body); -webkit-font-smoothing: antialiased; min-height: 100vh; }
a { color: inherit; }
button { font: inherit; color: inherit; }
img { max-width: 100%; }
.wrap { max-width: 1280px; margin: 0 auto; padding: 0 var(--g); }
.mono { font-family: var(--mono); }
.mut { color: var(--mut); }
.note { color: var(--fg2); font-size: 14px; margin: 0; }
::selection { background: var(--acc); color: #000; }

/* ---------- en-tête ---------- */
.hd { position: sticky; top: 0; z-index: 40; background: rgba(14,13,18,.97); border-bottom: 1px solid var(--line); backdrop-filter: blur(8px); }
.hd-in { height: 64px; display: flex; align-items: center; gap: 10px; }
@media (min-width: 900px) { .hd-in { height: 68px; gap: 14px; } }
.logo { display: flex; align-items: center; gap: 12px; text-decoration: none; background: none; border: 0; padding: 0; cursor: pointer; }
.logo-mk { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; background: radial-gradient(circle at 50% 40%, #3a1712, #1a0c0a); border: 2px solid #5a2a20; box-shadow: inset 0 0 0 2px #0e0d12; }
.logo-mk i { width: 22px; height: 22px; border-radius: 5px; background: var(--acc); display: grid; place-items: center; font: 700 13px/1 var(--body); color: #1a0c0a; font-style: normal; }
.logo b { font: 900 19px/1 var(--disp); letter-spacing: .02em; display: none; }
@media (min-width: 900px) { .logo b { display: block; } }
.nav { display: none; align-items: stretch; gap: 4px; height: 100%; margin-left: 18px; }
@media (min-width: 1000px) { .nav { display: flex; } }
.nav > a, .nav > div > button { position: relative; display: flex; align-items: center; gap: 6px; padding: 0 12px; height: 68px; font: 500 14px var(--body); color: var(--fg3); text-decoration: none; background: none; border: 0; cursor: pointer; }
.nav > a:hover, .nav > div > button:hover { color: var(--fg); }
.nav > a[aria-current="page"] { color: var(--fg); }
.nav > a[aria-current="page"]::after { content: ""; position: absolute; left: 12px; right: 12px; bottom: 0; height: 2px; background: var(--acc); border-radius: 2px; }
.nav .ev { color: var(--gold); font-weight: 700; }
.nav .dd { position: relative; display: flex; }
.dd-menu { position: absolute; top: 60px; left: 0; min-width: 220px; padding: 8px; background: var(--panel); border: 1px solid var(--line2); border-radius: var(--r-lg); box-shadow: var(--sh-2); display: flex; flex-direction: column; z-index: 50; }
.dd-menu a { padding: 10px 12px; border-radius: var(--r-md); text-decoration: none; font-size: 14px; color: var(--fg3); display: flex; gap: 10px; align-items: center; }
.dd-menu a:hover { background: var(--raise); color: var(--fg); }
.dd-menu a i { font-style: normal; color: var(--mut); width: 18px; text-align: center; }
.hd-r { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.wal { display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 14px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line2); font: 500 14px var(--mono); cursor: pointer; }
.wal .bar { width: 26px; height: 6px; border-radius: 6px; background: var(--line2); overflow: hidden; }
.wal .bar i { display: block; height: 100%; background: var(--acc); border-radius: 6px; }
.wal .sep { width: 1px; height: 18px; background: var(--line3); }
.wal .ess { display: flex; align-items: center; gap: 6px; }
.dia { display: inline-block; width: .62em; height: .62em; transform: rotate(45deg); border: 1.6px solid var(--cyan); border-radius: 1px; vertical-align: .05em; }
.dia.f { background: var(--cyan); }
.ib { position: relative; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: var(--panel); border: 1px solid var(--line2); cursor: pointer; padding: 0; color: var(--fg); flex: none; }
.ib:hover { border-color: var(--line3); }
.ib svg { width: 20px; height: 20px; }
.ib .dot { position: absolute; top: 4px; right: 5px; width: 8px; height: 8px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 0 2px var(--bg); }
.badge { position: absolute; top: -5px; right: -5px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--gold); color: #1a1405; font: 700 11px/18px var(--mono); text-align: center; box-shadow: 0 0 0 2px var(--bg); }
.mpill { display: none; align-items: center; gap: 8px; height: 44px; padding: 0 16px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line2); cursor: pointer; font: 500 14px var(--body); position: relative; }
.mpill .kj { color: var(--fg2); }
@media (min-width: 900px) { .mpill { display: flex; } }
.av-btn { width: 44px; height: 44px; border-radius: 50%; padding: 2px; border: 2px solid var(--cyan); background: var(--bg); cursor: pointer; position: relative; display: none; }
.av-btn img, .av-btn span { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; display: grid; place-items: center; background: var(--raise); font: 700 15px var(--disp); }
.av-btn .dot { position: absolute; top: -1px; right: -1px; width: 9px; height: 9px; border-radius: 50%; background: #4d7bff; box-shadow: 0 0 0 2px var(--bg); }
@media (min-width: 900px) { .av-btn { display: block; } .burger { display: none !important; } }

/* menu (burger sur téléphone, avatar sur ordi) */
.menu { position: fixed; z-index: 39; top: 64px; left: 0; right: 0; max-height: calc(100vh - 64px); overflow-y: auto; background: var(--bg); border-bottom: 1px solid var(--line); padding: 14px var(--g) 24px; box-shadow: var(--sh-2); }
@media (min-width: 900px) { .menu { top: 76px; left: auto; right: var(--g); width: 420px; border: 1px solid var(--line2); border-radius: var(--r-xl); max-height: calc(100vh - 96px); } }
.acc-card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-xl); padding: 16px; display: flex; flex-direction: column; gap: 14px; }
.acc-top { display: flex; align-items: center; gap: 14px; }
.ring-av { width: 52px; height: 52px; border-radius: 50%; padding: 3px; border: 2px solid var(--cyan); flex: none; }
.ring-av img, .ring-av span { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; display: grid; place-items: center; background: var(--raise); font: 700 18px var(--disp); color: var(--cyan); }
.acc-top b { display: block; font: 700 17px var(--disp); }
.acc-top small { font: 500 12px var(--mono); color: var(--mut); }
.disc-box { background: #5865f21a; border: 1px solid #5865f255; border-radius: var(--r-lg); padding: 14px; display: flex; flex-direction: column; gap: 10px; font-size: 14px; color: var(--fg2); }
.btn-disc { display: flex; align-items: center; justify-content: center; gap: 10px; height: 44px; border-radius: var(--r-md); background: #5865f2; color: #fff; font: 700 15px var(--body); text-decoration: none; border: 0; cursor: pointer; }
.btn-disc svg { width: 20px; height: 20px; }
.acc-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.acc-stats div { background: var(--bg2); border-radius: var(--r-md); padding: 8px 10px; }
.acc-stats small { display: block; font-size: 12px; color: var(--fg2); }
.acc-stats b { font: 500 15px var(--mono); }
.mgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
.mgrid button { display: flex; align-items: center; gap: 14px; height: 52px; padding: 0 16px; border-radius: var(--r-lg); background: var(--panel); border: 1px solid var(--line); cursor: pointer; font: 700 15px var(--body); text-align: left; position: relative; }
.mgrid button:hover { border-color: var(--line3); }
.mgrid button[aria-current="page"] { border-color: var(--acc); }
.mgrid button i { font: 400 18px var(--body); font-style: normal; color: var(--mut); width: 20px; text-align: center; }
.mgrid button[aria-current="page"] i { color: var(--acc); }
.mgrid .badge { position: static; margin-left: auto; box-shadow: none; }
.mgrid .gold i { color: var(--gold); }
.m-foot { margin-top: 14px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 6px 16px; }
.m-foot a, .m-foot button { display: block; width: 100%; text-align: left; padding: 12px 0; background: none; border: 0; text-decoration: none; font-size: 14px; color: var(--fg2); cursor: pointer; }
.m-foot a:first-child, .m-foot button:first-child { color: var(--acc); font-weight: 700; border-bottom: 1px solid var(--line2); }

/* ---------- typo et blocs communs ---------- */
main { min-height: 60vh; }
.page { padding-top: 48px; padding-bottom: 72px; display: flex; flex-direction: column; gap: 28px; }
.page > * { min-width: 0; }
.eyebrow { font: 500 12px/1.4 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--acc); margin: 0; }
.eyebrow.gold { color: var(--gold); }
.eyebrow.mut { color: var(--mut); }
h1 { font: 900 38px/1.02 var(--disp); margin: 6px 0 0; letter-spacing: -.01em; }
@media (min-width: 900px) { h1 { font-size: 56px; } }
h1 em { font-style: normal; color: var(--acc); }
h2 { font: 700 24px/1.15 var(--disp); margin: 0; }
@media (min-width: 900px) { h2 { font-size: 30px; } }
h3 { font: 700 20px/1.2 var(--disp); margin: 0; }
.lead { font-size: 17px; color: var(--fg2); line-height: 1.7; margin: 0; max-width: 62ch; }
.head { display: flex; flex-direction: column; gap: 14px; }
.sec { display: flex; flex-direction: column; gap: 18px; }
.sec-h { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.link { color: var(--acc); font-weight: 700; font-size: 15px; text-decoration: none; background: none; border: 0; padding: 0; cursor: pointer; }
.link:hover { text-decoration: underline; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-xl); padding: 22px; }
.card.dash { border-style: dashed; border-color: var(--line3); }
.hr { height: 1px; background: var(--line); border: 0; margin: 0; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.empty { text-align: center; color: var(--mut); padding: 30px 10px; font-size: 15px; }
.empty .o { width: 44px; height: 44px; border-radius: 50%; border: 1.5px solid var(--line3); margin: 0 auto 12px; display: grid; place-items: center; }
.empty .o::after { content: ""; width: 4px; height: 4px; border-radius: 50%; background: var(--fg); }

/* boutons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 48px; padding: 0 24px; border-radius: 999px; border: 1px solid var(--line2); background: rgba(14,13,18,.5); color: var(--fg); font: 700 16px var(--body); cursor: pointer; text-decoration: none; white-space: nowrap; transition: filter .15s, transform .1s, border-color .15s; }
.btn:hover:not(:disabled) { border-color: var(--line3); filter: brightness(1.1); }
.btn:active:not(:disabled) { transform: scale(.98); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.acc { background: var(--acc); border-color: var(--acc); color: #1a0c0a; font: 700 15px var(--disp); }
.btn.gold { background: var(--gold); border-color: var(--gold); color: #1a1405; font: 700 15px var(--disp); }
.btn.big { height: 58px; padding: 0 26px; font-size: 17px; }
.btn.sm { height: 36px; padding: 0 14px; font-size: 13px; }
.btn.xs { height: 30px; padding: 0 12px; font-size: 12px; }
.btn.sq { border-radius: var(--r-md); }
.btn.ok { background: var(--ok); border-color: var(--ok); color: #071a10; }
.btn.vio { background: var(--r-e); border-color: var(--r-e); color: #13071f; }
.btn.block { width: 100%; }
.btn .n { font: 500 13px var(--mono); padding-left: 10px; margin-left: 4px; border-left: 1px solid currentColor; opacity: .8; }
.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 18px; border-radius: 999px; border: 1px solid var(--line2); background: var(--bg2); font: 700 14px var(--body); cursor: pointer; color: var(--fg); }
.chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.chip .d { width: 8px; height: 8px; border-radius: 50%; }
.chip .kj { color: var(--acc); font-weight: 500; }
.chip[aria-pressed="true"] .kj { color: var(--acc); }
.seg { display: inline-flex; gap: 4px; padding: 4px; border-radius: 999px; background: var(--bg2); border: 1px solid var(--line2); max-width: 100%; overflow-x: auto; scrollbar-width: none; }
.seg button { height: 38px; padding: 0 16px; border-radius: 999px; border: 0; background: none; font: 700 14px var(--body); color: var(--fg3); cursor: pointer; position: relative; white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--raise); color: var(--fg); }
.seg.light button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
.seg.gold button[aria-pressed="true"] { background: var(--gold); color: #1a1405; }
.seg .dot { position: absolute; top: 6px; right: 6px; width: 6px; height: 6px; border-radius: 50%; background: var(--gold); }
.utabs { display: flex; gap: 6px; border-bottom: 1px solid var(--line2); overflow-x: auto; scrollbar-width: none; }
.utabs button { flex: none; position: relative; height: 46px; padding: 0 16px; background: none; border: 0; font: 700 14px var(--body); color: var(--fg3); cursor: pointer; }
.utabs button[aria-pressed="true"] { color: var(--fg); }
.utabs button[aria-pressed="true"]::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: var(--acc); }
.utabs .badge { position: static; margin-left: 6px; box-shadow: none; display: inline-block; }
.in, .field input, .field select, .field textarea { width: 100%; height: 46px; padding: 0 14px; border-radius: var(--r-md); border: 1px solid var(--line2); background: var(--bg2); color: var(--fg); font: 500 15px var(--body); }
.field textarea, textarea.in { height: auto; padding: 12px 14px; resize: vertical; }
.in:focus, .field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--line3); }
.search { position: relative; }
.search svg { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--mut); }
.search .in { padding-left: 46px; height: 46px; }
.field { display: flex; flex-direction: column; gap: 6px; font: 700 13px var(--body); color: var(--fg2); }
.flt { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--fg2); flex-wrap: wrap; }
.flt label { display: flex; align-items: center; gap: 10px; }
.flt select { height: 44px; min-width: 150px; }
.flt input.in { width: 84px; }
.pill { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 12px; border-radius: 999px; font: 500 12px var(--mono); border: 1px solid var(--line3); color: var(--fg2); white-space: nowrap; }
.pill.gold { border-color: #f5c51888; color: var(--gold); }
.pill.acc { background: var(--acc); border-color: var(--acc); color: #1a0c0a; font: 700 12px var(--body); border-radius: var(--r-sm); }
.pill.out { border-color: var(--acc); color: var(--acc); font: 700 12px var(--body); border-radius: var(--r-sm); }
.pill.ok { border-color: #3fbf7f88; color: var(--ok); }
.pill.box { border-radius: var(--r-sm); font: 700 12px var(--body); }
.kj { font-family: var(--body); }

/* ---------- carte à collectionner (format Kyara) ---------- */
.kcw { container-type: inline-size; position: relative; width: var(--w, 100%); flex: none; }
.kcw[data-card] { cursor: pointer; }
.kcw[data-card]:hover .kc { transform: translateY(-3px); }
.kc { --rc: var(--r-c); position: relative; width: 100%; aspect-ratio: 5 / 7.4; transition: transform .15s; border-radius: 6cqw; border: max(2px, 1.1cqw) solid var(--rc); background: linear-gradient(170deg, color-mix(in srgb, var(--rc) 26%, #17161d), color-mix(in srgb, var(--rc) 10%, #0e0d12) 70%); padding: 4cqw; display: flex; flex-direction: column; gap: 3cqw; overflow: hidden; user-select: none; box-shadow: 0 8px 20px #0007; }
.kc.r-c { --rc: var(--r-c); } .kc.r-pc { --rc: var(--r-pc); } .kc.r-r { --rc: var(--r-r); } .kc.r-e { --rc: var(--r-e); } .kc.r-l { --rc: var(--r-l); } .kc.r-m { --rc: var(--r-m); }
.kc-h { display: flex; align-items: center; gap: 3cqw; min-height: 11cqw; padding: 0 1cqw; }
.kc-h b { flex: 1; min-width: 0; font: 700 7.6cqw/1.1 var(--disp); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #fff; }
.kc-h i { flex: none; width: 10cqw; height: 10cqw; border-radius: 50%; background: var(--rc); color: #15141a; font: 900 5.6cqw/10cqw var(--disp); text-align: center; font-style: normal; }
.kc-a { position: relative; flex: 1; border-radius: 4cqw; overflow: hidden; background: #0e0d12; }
.kc-a .ph, .kc-a .layer, .kc-a .photo { position: absolute; inset: 0; background-size: cover; background-position: var(--pos, 50% 22%); }
.kc-a .mono-a { position: absolute; inset: 0; display: grid; place-items: center; font: 900 20cqw var(--disp); color: color-mix(in srgb, var(--rc) 70%, #fff); background: radial-gradient(circle at 50% 40%, color-mix(in srgb, var(--rc) 35%, #1e1c26), #0e0d12); }
.kc-jp { position: absolute; top: 3cqw; right: 3cqw; writing-mode: vertical-rl; font: 700 10cqw/1 var(--body); color: #fff; opacity: .28; letter-spacing: .05em; text-shadow: 0 0 6px #000; pointer-events: none; }
.kc-no { position: absolute; left: 4cqw; bottom: 3cqw; font: 500 5.4cqw var(--mono); color: #fff; text-shadow: 0 1px 4px #000; }
.kc-s { font: 700 5.6cqw/1.2 var(--body); color: var(--fg3); padding: 0 1cqw; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kc-p { display: flex; justify-content: space-between; padding: 2.4cqw 4cqw; border-radius: 3cqw; background: rgba(14,13,18,.55); font: 700 5.6cqw var(--mono); color: var(--fg); }
.kc-tag { position: absolute; z-index: 3; top: -1px; left: 50%; transform: translateX(-50%); padding: 1cqw 4cqw; border-radius: 0 0 3cqw 3cqw; background: var(--fg); color: var(--bg); font: 700 5cqw var(--body); white-space: nowrap; }
.kc-n { position: absolute; z-index: 3; top: 17cqw; right: 6cqw; padding: 1cqw 3.4cqw; border-radius: 99px; background: rgba(14,13,18,.85); font: 700 6cqw var(--mono); border: 1px solid var(--line3); }
.kc-new { position: absolute; z-index: 3; top: 17cqw; left: 6cqw; padding: 1cqw 3.4cqw; border-radius: 99px; background: var(--acc); color: #1a0c0a; font: 700 5cqw var(--body); }
/* effets par rareté */
.kc.r-pc { box-shadow: 0 0 0 1px #3fbf7f33, 0 8px 20px #0007; }
.kc.r-r { box-shadow: 0 0 18px #4d9bff44, 0 8px 20px #0007; }
.kc.r-e::after, .kc.r-l::after, .kc.r-m::after, .kc.gold::after { content: ""; position: absolute; inset: 0; pointer-events: none; border-radius: inherit; background: linear-gradient(115deg, transparent 30%, rgba(255,255,255,.16) 45%, rgba(190,140,255,.14) 52%, transparent 66%); background-size: 260% 100%; animation: holo 4.5s linear infinite; mix-blend-mode: screen; }
.kc.r-e { box-shadow: 0 0 22px #b072ff55, 0 8px 20px #0007; }
.kc.r-l { box-shadow: 0 0 30px #f5c51866, 0 8px 20px #0007; background: linear-gradient(170deg, #5a4a10, #2a2208 60%, #15120a); }
.kc.r-m { box-shadow: 0 0 34px #ff4d2e77, 0 8px 20px #0007; background: linear-gradient(170deg, #5a1a10, #2a0e0a 60%, #150806); }
.kc.r-m::after { background: linear-gradient(115deg, transparent 25%, rgba(255,120,80,.22) 40%, rgba(255,220,120,.18) 50%, rgba(120,200,255,.16) 58%, transparent 72%); background-size: 260% 100%; }

.alb .stack { position: relative; width: 70px; height: 92px; flex: none; }
.alb .stack .th { position: absolute; width: 56px; height: 78px; border-radius: 8px; overflow: hidden; border: 2px solid var(--line3); background: var(--raise); }
.alb .stack .th:nth-child(1) { left: 0; top: 10px; transform: rotate(-8deg); }
.alb .stack .th:nth-child(2) { left: 14px; top: 4px; z-index: 2; }
.alb .stack .th .layer, .alb .stack .th .photo { position: absolute; inset: 0; background-size: cover; background-position: 50% 22%; }
.alb b { display: block; font: 700 16px var(--disp); }
.alb .m { margin-top: 8px; height: 6px; border-radius: 6px; background: var(--line); overflow: hidden; }
.alb .m i { display: block; height: 100%; background: var(--acc); }
.alb small { font: 500 12px var(--mono); color: var(--fg2); }
.alb.full { border-color: #f5c51866; }

/* ---------- marché ---------- */
.gate { display: flex; gap: 16px; }
.gate .lk { width: 44px; height: 44px; border-radius: var(--r-md); background: var(--raise); display: grid; place-items: center; color: var(--acc); flex: none; }
.gate .lk svg { width: 20px; height: 20px; }
.gate h3 { font-size: 18px; }
.gate ul { margin: 6px 0; padding-left: 18px; font-size: 14px; color: var(--fg2); }
.gate .mono { font-size: 12px; color: var(--mut); }
.mk-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (min-width: 700px) { .mk-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (min-width: 1000px) { .mk-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; } }
@media (min-width: 1250px) { .mk-grid { grid-template-columns: repeat(5, minmax(0, 1fr)); } }
.ls { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-xl); padding: 10px 10px 12px; display: flex; flex-direction: column; gap: 8px; cursor: pointer; min-width: 0; }
.ls:hover { border-color: var(--line3); }
.ls.wish { border-color: #ff4d9e88; }
.ls-r { display: flex; justify-content: space-between; align-items: center; gap: 6px; }
.ls-st { font: 700 12px var(--mono); color: var(--ok); }
.ls-st.end { color: var(--acc); }
.ls-p { font: 900 22px var(--disp); display: flex; align-items: center; gap: 6px; }
.ls-p .dia { width: 12px; height: 12px; background: var(--cyan); border: 0; }
.ls-m { display: flex; justify-content: space-between; font: 500 11px var(--mono); color: var(--fg2); gap: 6px; }
.ls-m span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ls-m .up { color: var(--danger); } .ls-m .dn { color: var(--ok); }
.comptoir { position: fixed; z-index: 30; right: 16px; bottom: 16px; height: 52px; padding: 0 22px; border-radius: 999px; background: var(--acc); color: #1a0c0a; border: 0; font: 700 16px var(--disp); display: flex; align-items: center; gap: 10px; cursor: pointer; box-shadow: 0 10px 30px #ff4d2e55; }
.comptoir svg { width: 20px; height: 20px; }
.comptoir .badge { background: var(--fg); color: var(--bg); }
.trade { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-xl); padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.trade-sides { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.trade-sides > div { background: var(--bg2); border-radius: var(--r-md); padding: 10px; display: flex; flex-wrap: wrap; gap: 6px; align-content: flex-start; }
.trade-sides small { width: 100%; font: 500 11px var(--mono); color: var(--mut); text-transform: uppercase; letter-spacing: .1em; }
.ti { display: inline-flex; padding: 2px 8px; border-radius: 6px; border: 1px solid var(--rc, var(--line3)); color: var(--rc, var(--fg)); font: 700 12px var(--body); }
.ti.r-c { --rc: var(--r-c); } .ti.r-pc { --rc: var(--r-pc); } .ti.r-r { --rc: var(--r-r); } .ti.r-e { --rc: var(--r-e); } .ti.r-l { --rc: var(--r-l); } .ti.r-m { --rc: var(--r-m); }
.pick-list { display: flex; flex-direction: column; gap: 6px; max-height: 260px; overflow-y: auto; }
.pick { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: var(--r-md); background: var(--bg2); border: 1px solid var(--line); font: 700 13px var(--body); cursor: pointer; }
.pick span { margin-left: auto; font: 500 11px var(--mono); color: var(--rc, var(--mut)); }
.pick.r-c { --rc: var(--r-c); } .pick.r-pc { --rc: var(--r-pc); } .pick.r-r { --rc: var(--r-r); } .pick.r-e { --rc: var(--r-e); } .pick.r-l { --rc: var(--r-l); } .pick.r-m { --rc: var(--r-m); }
.trade-cols { display: grid; gap: 14px; }
@media (min-width: 700px) { .trade-cols { grid-template-columns: 1fr 1fr; } }
fieldset { border: 1px solid var(--line2); border-radius: var(--r-lg); padding: 12px; margin: 0; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
legend { font: 700 14px var(--disp); padding: 0 6px; }
.chart { width: 100%; height: 170px; }
.kv3 { display: flex; gap: 22px; flex-wrap: wrap; }
.kv3 small { display: block; font-size: 12px; color: var(--fg2); }
.kv3 b { font: 900 20px var(--disp); }

/* ---------- missions ---------- */
.mbox { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-xl); padding: 22px; display: flex; flex-direction: column; gap: 14px; }
.mbox-h { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
.mbox-h .eyebrow { color: var(--mut); }
.mbox-h h2 { font-size: 22px; margin-top: 4px; }
.days { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.day { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 0 8px; border-radius: var(--r-lg); border: 1px solid var(--line2); background: var(--bg2); font: 500 13px var(--mono); color: var(--fg2); min-width: 0; }
.day i { width: 26px; height: 26px; border-radius: 50%; border: 1px solid var(--line3); display: grid; place-items: center; font: 500 13px var(--body); font-style: normal; color: var(--fg2); }
.day.now { border-color: var(--gold); background: #f5c5180f; box-shadow: 0 0 18px #f5c51833; color: var(--fg); }
.day.now i, .day.last i { border-color: var(--gold); color: var(--gold); background: #f5c5181a; }
.day.done { border-color: #3fbf7f66; }
.day.done i { background: var(--ok); border-color: var(--ok); color: #071a10; }
.day span { font: 500 12px var(--mono); color: var(--fg); white-space: nowrap; }
.mr { display: grid; grid-template-columns: 1fr auto; gap: 6px 16px; align-items: center; padding: 14px; border-radius: var(--r-lg); border: 1px solid var(--line); background: var(--bg2); }
.mr.claimed { opacity: .5; }
.mr .t { display: flex; justify-content: space-between; gap: 10px; font: 700 14px var(--body); }
.mr .t span { font: 500 12px var(--mono); color: var(--fg2); flex: none; }
.mr .bar { height: 5px; border-radius: 5px; background: var(--line2); overflow: hidden; grid-column: 1; }
.mr .bar i { display: block; height: 100%; background: var(--cyan); }
.mr .rw { font: 700 14px var(--mono); color: var(--cyan); grid-column: 1; display: flex; align-items: center; gap: 6px; }
.mr .rw .dia { background: var(--cyan); border: 0; width: 10px; height: 10px; }
.mr .s { grid-column: 2; grid-row: 1 / span 3; font: 500 13px var(--mono); color: var(--fg2); }
.mbonus { border-top: 1px dashed var(--line3); padding-top: 12px; font-size: 13px; color: var(--fg2); display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.ach { display: flex; gap: 16px; padding: 16px; border-radius: var(--r-xl); border: 1px solid var(--line); background: var(--panel); }
.ach .ic { width: 44px; height: 44px; border-radius: var(--r-md); border: 1px solid var(--line2); display: grid; place-items: center; font: 500 18px var(--body); color: var(--dim); flex: none; }
.ach.ok .ic { border-color: var(--gold); color: var(--gold); background: #f5c51814; }
.ach .bd { flex: 1; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.ach b { font: 700 15px var(--body); }
.ach p { margin: 0; font-size: 14px; color: var(--fg2); }
.ach .bar { height: 5px; border-radius: 5px; background: var(--line2); overflow: hidden; }
.ach .bar i { display: block; height: 100%; background: var(--gold); }
.ach small { font: 500 12px var(--mono); color: var(--fg2); }
.ach .btn { align-self: center; }

/* ---------- prédictions ---------- */
.pq { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-xl); padding: 20px; display: flex; flex-direction: column; gap: 14px; }
.pq.open { border-color: #b072ff55; }
.pq-h { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.pq h3 { font-size: 18px; line-height: 1.35; }
.pq-o { display: flex; flex-direction: column; gap: 8px; }
.pq-o button { position: relative; overflow: hidden; display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 10px 16px; border-radius: var(--r-lg); border: 1px solid var(--line2); background: var(--bg2); font: 700 15px var(--body); text-align: left; cursor: pointer; color: var(--fg); }
.pq-o button:disabled { cursor: default; }
.pq-o button .fill { position: absolute; inset: 0 auto 0 0; background: #b072ff1f; z-index: 0; }
.pq-o button > * { position: relative; z-index: 1; }
.pq-o button em { margin-left: auto; font: 500 12px var(--mono); color: var(--fg2); font-style: normal; }
.pq-o button.mine { border-color: var(--r-e); box-shadow: 0 0 0 1px var(--r-e) inset; }
.pq-o button.good { border-color: var(--ok); background: #3fbf7f14; }
.pq-o button.bad { border-color: var(--danger); }
.pq-res { font-size: 14px; color: var(--fg2); margin: 0; }
.pq-adm { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; border-top: 1px dashed var(--line3); padding-top: 12px; }
.pq-adm select, .pq-adm input { height: 36px; border-radius: 999px; padding: 0 12px; background: var(--bg2); border: 1px solid var(--line2); color: var(--fg); font: 500 13px var(--body); }
.pq-adm input { width: 90px; }
.adm-list { display: flex; flex-direction: column; gap: 8px; }
.adm-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 10px 12px; border-radius: var(--r-lg); background: var(--bg2); border: 1px solid var(--line); }
.adm-row .who { flex: 1; }
.adm-row select { height: 36px; border-radius: 999px; padding: 0 12px; background: var(--panel); border: 1px solid var(--line2); color: var(--fg); }
.adm-name { flex: 1; } .adm-name b { display: block; } .adm-name span { font-size: 12px; color: var(--mut); }
.adm-checks { display: flex; flex-direction: column; gap: 6px; max-height: 50vh; overflow-y: auto; }
.adm-checks label { display: flex; gap: 10px; align-items: center; padding: 8px 10px; border-radius: var(--r-md); background: var(--bg2); font-size: 14px; }
.adm-checks span { margin-left: auto; color: var(--mut); font-size: 12px; }

/* ---------- fiche perso, profil ---------- */
.crumb { font-size: 14px; color: var(--fg2); display: flex; gap: 10px; flex-wrap: wrap; }
.crumb button { background: none; border: 0; padding: 0; color: var(--fg2); cursor: pointer; font-size: 14px; }
.crumb i { font-style: normal; color: var(--dim); }
.wk-head { position: relative; overflow: hidden; padding: 32px 0 30px; border-bottom: 1px solid var(--line); background: repeating-linear-gradient(135deg, #ffffff05 0 2px, transparent 2px 14px); }
.wk-head .ghost { position: absolute; right: -10px; top: 0; font: 900 120px/1 var(--body); color: #ffffff08; writing-mode: vertical-rl; pointer-events: none; }
.wk-grid { display: grid; gap: 24px; }
@media (min-width: 900px) { .wk-grid { grid-template-columns: 360px 1fr; align-items: start; } }
.wk-card { display: flex; flex-direction: column; align-items: center; gap: 14px; }
.wk-card .kcw { --w: 260px; }
.facts { display: grid; grid-template-columns: 130px 1fr; gap: 12px 16px; margin: 0; font-size: 15px; }
.facts dt { color: var(--mut); font-weight: 700; font-size: 13px; text-transform: uppercase; letter-spacing: .06em; }
.facts dd { margin: 0; color: var(--fg); }
.quotes q { display: block; font-style: italic; color: var(--fg2); margin-bottom: 6px; }
.pf-head { position: relative; padding: 40px 0 10px; background: radial-gradient(60% 80% at 20% 0%, #ff4d2e1c, transparent 70%); }
.pf-av { width: 150px; height: 150px; border-radius: 50%; padding: 4px; border: 2px solid var(--r-r); }
.pf-av img, .pf-av span { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; background: var(--raise); display: grid; place-items: center; font: 900 50px var(--disp); }
.pf-name { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.seal { display: inline-flex; flex-direction: column; align-items: center; }
.seal b { padding: 2px 10px; border-radius: 6px; background: linear-gradient(180deg, #e8384a, #a01628); border: 2px solid #f5c518; color: #fff; font: 700 18px var(--body); transform: rotate(-4deg); box-shadow: 0 4px 12px #a0162866; }
.seal small { font: 700 10px var(--mono); color: var(--gold); letter-spacing: .1em; margin-top: 2px; }
.stat4 { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
@media (min-width: 900px) { .stat4 { grid-template-columns: repeat(4, 1fr); } }
.stat4 b { display: block; font: 900 30px/1 var(--disp); }
.stat4 b small { color: var(--dim); font-size: inherit; }
.stat4 span { font: 500 12px var(--body); text-transform: uppercase; color: var(--fg2); letter-spacing: .04em; }
.stat4 .acc b { color: var(--acc); }
.rarbars { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
@media (min-width: 900px) { .rarbars { grid-template-columns: repeat(6, 1fr); } }
.rarbars div { padding: 10px 12px; border-radius: var(--r-md); background: var(--bg2); border: 1px solid var(--line); }
.rarbars small { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--fg2); }
.rarbars small i { width: 7px; height: 7px; border-radius: 50%; background: var(--c); }
.rarbars b { font: 700 18px var(--mono); }
.vitrine { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
@media (min-width: 900px) { .vitrine { grid-template-columns: repeat(4, minmax(0, 1fr)); max-width: 900px; } }
.rar-ex { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
@media (min-width: 900px) { .rar-ex { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (min-width: 1200px) { .rar-ex { grid-template-columns: repeat(6, minmax(0, 1fr)); } }
.rar-ex h3 { display: flex; align-items: center; gap: 8px; font-size: 16px; margin-top: 8px; }
.rar-ex h3 i { width: 10px; height: 10px; border-radius: 50%; background: var(--c); }
.rar-ex p { margin: 2px 0 0; font-size: 13px; color: var(--fg2); }
.rar-ex .mono { font-size: 13px; color: var(--fg); }
.rules { display: flex; flex-direction: column; gap: 14px; max-width: 760px; counter-reset: r; }
.rules li { list-style: none; padding: 16px 18px 16px 58px; position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-xl); color: var(--fg2); font-size: 15px; }
.rules li::before { counter-increment: r; content: counter(r, decimal-leading-zero); position: absolute; left: 18px; top: 16px; font: 900 18px var(--disp); color: var(--acc); }
.rules li b { color: var(--fg); }
.prose { max-width: 760px; display: flex; flex-direction: column; gap: 14px; color: var(--fg2); font-size: 16px; }
.prose h2 { color: var(--fg); margin-top: 20px; font-size: 22px; }
.prose p { margin: 0; }
.log { display: flex; flex-direction: column; gap: 10px; max-width: 760px; }
.log h3 { font-size: 16px; margin-top: 18px; color: var(--fg); }
.log h3 small { font: 500 13px var(--mono); color: var(--mut); margin-left: 8px; }
.log div { display: flex; gap: 12px; padding: 12px 14px; border-radius: var(--r-lg); background: var(--panel); border: 1px solid var(--line); font-size: 14px; color: var(--fg2); }
.log div em { font-style: normal; font: 700 12px var(--body); padding: 2px 8px; border-radius: 6px; height: fit-content; white-space: nowrap; }
.log .n em { background: #3fbf7f22; color: var(--ok); } .log .a em { background: #4d9bff22; color: var(--r-r); } .log .c em { background: #ff4d2e22; color: var(--acc); }
.starpick { display: flex; gap: 6px; }
.starpick button { width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--line2); background: var(--bg2); color: var(--dim); font-size: 20px; cursor: pointer; }
.starpick button.on { color: var(--gold); border-color: #f5c51866; }

/* ---------- fenêtres ---------- */
.overlay { position: fixed; inset: 0; z-index: 60; background: rgba(5,5,8,.72); display: flex; align-items: flex-end; justify-content: center; backdrop-filter: blur(3px); }
@media (min-width: 700px) { .overlay { align-items: center; padding: 24px; } }
.sheet { width: 100%; max-width: 560px; max-height: 92vh; overflow-y: auto; background: var(--panel); border: 1px solid var(--line2); border-radius: 22px 22px 0 0; display: flex; flex-direction: column; animation: up .22s ease-out; }
@media (min-width: 700px) { .sheet { border-radius: 22px; } }
@keyframes up { from { transform: translateY(30px); opacity: 0; } to { transform: none; opacity: 1; } }
.sheet-h { display: flex; align-items: center; justify-content: space-between; padding: 18px 20px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--panel); z-index: 2; }
.sheet-h h2 { font-size: 20px; }
.sheet-b { padding: 20px; display: flex; flex-direction: column; gap: 16px; }
.sheet-b .kcw { --w: 220px; align-self: center; }
.x { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line2); background: var(--bg2); color: var(--fg); cursor: pointer; display: grid; place-items: center; font-size: 18px; }
.box2 { display: flex; justify-content: space-between; padding: 16px; border: 1px solid var(--line2); border-radius: var(--r-lg); }
.box2 small { display: block; font-size: 12px; color: var(--fg2); }
.box2 b { font: 900 32px/1.1 var(--disp); display: flex; align-items: center; gap: 8px; }
.box2 .st { text-align: right; } .box2 .st b { font: 500 24px var(--mono); }
.toast { position: fixed; left: 50%; bottom: 84px; transform: translateX(-50%); z-index: 80; padding: 12px 18px; border-radius: 999px; background: var(--fg); color: var(--bg); font: 700 14px var(--body); box-shadow: var(--sh-2); max-width: calc(100% - 32px); text-align: center; }

/* ---------- notifications et chat (comptoir) ---------- */
.np { position: fixed; z-index: 45; top: 72px; right: 12px; width: min(400px, calc(100vw - 24px)); max-height: min(72vh, 600px); overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 8px; background: var(--panel); border: 1px solid var(--line2); border-radius: var(--r-xl); box-shadow: var(--sh-2); }
.np-head { display: flex; justify-content: space-between; align-items: center; }
.np-head b { font: 700 17px var(--disp); }
.linkbtn { background: none; border: 0; padding: 0; color: var(--acc); font: 700 13px var(--body); cursor: pointer; }
.np-sec { margin-top: 8px; font: 500 11px var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--mut); }
.np-item { display: flex; gap: 12px; align-items: flex-start; width: 100%; padding: 12px; border-radius: var(--r-lg); background: var(--bg2); border: 1px solid var(--line); color: var(--fg); font: 500 14px/1.45 var(--body); text-align: left; cursor: pointer; }
.np-item.unread { border-color: #ff4d2e66; background: #ff4d2e0d; }
.np-item small { display: block; font: 500 11px var(--mono); color: var(--mut); margin-top: 2px; }
.np-ic { flex: none; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-style: normal; font: 700 13px var(--body); background: var(--raise); color: var(--fg2); }
.np-ic.k-sold { color: var(--cyan); } .np-ic.k-trade { color: var(--ok); } .np-ic.k-mention { color: var(--wish); } .np-ic.k-episode, .np-ic.k-announce { color: var(--gold); } .np-ic.k-pred { color: var(--r-e); } .np-ic.todo { background: var(--acc); color: #1a0c0a; }
.chat { position: fixed; z-index: 50; right: 0; top: 0; bottom: 0; width: min(420px, 100vw); display: flex; flex-direction: column; background: var(--bg2); border-left: 1px solid var(--line2); box-shadow: var(--sh-2); }
.chat-head { display: flex; align-items: center; gap: 12px; padding: 16px 18px; border-bottom: 1px solid var(--line); }
.chat-head h2 { font-size: 20px; flex: 1; }
.chat-head h2 small { display: block; font: 500 11px var(--mono); letter-spacing: .14em; color: var(--acc); text-transform: uppercase; }
.chat-x { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line2); background: var(--panel); color: var(--fg); cursor: pointer; font-size: 18px; }
.chat-list { flex: 1; overflow-y: auto; padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; }
.cm { display: flex; gap: 10px; align-items: flex-start; }
.cm .av { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; flex: none; border: 2px solid var(--line3); background: var(--raise); }
.cm-b { flex: 1; min-width: 0; }
.cm-h { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; }
