@media (max-width: 600px) { .ar-pre-body { top: 112px; max-height: calc(100% - 180px); padding: 12px; } .ar-pre-body.ph-contributions { max-height: 72vh; } .ar-pre-body.ph-lobby { left: 0; top: auto; bottom: 0; width: 100vw; max-height: 52vh; border-radius: 16px 16px 0 0; } .ar-pre-body.ph-choix .cf-perso.big .kcw { --w: 150px; } }

/* ===== Confrontation : cartes de la table (chacun son deck / partagées), partage du salon ===== */
.cf-modes { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; width: 100%; }
.cf-mode { display: flex; flex-direction: column; gap: 4px; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line3); background: var(--bg2); color: var(--fg); text-align: left; font: inherit; cursor: pointer; }
.cf-mode b { font: 700 14px var(--body); } .cf-mode small { font: 500 12px/1.4 var(--body); color: var(--mut); }
.cf-mode.on, .cf-mode:has(input:checked) { border-color: var(--gold); box-shadow: 0 0 14px #f5c51833; }
.cf-mode input { position: absolute; opacity: 0; pointer-events: none; }
label.cf-mode { position: relative; }
.cf-share .row { flex-wrap: wrap; gap: 8px; margin: 12px 0; } .cf-share input { width: 100%; }
.cf-defis .cf-row { border-color: var(--gold); }
.cf-lobby .pill.cf-ready { border-color: #3fbf7f88; color: #7fe0ad; }

/* ===== Confrontation : choix des cartes façon draft ===== */
.cf-deckbar { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 8px; }
@media (max-width: 800px) { .cf-deckbar { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.cf-slot { position: relative; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 4px; border-radius: 12px; border: 1px dashed var(--line3); background: var(--bg2); color: var(--fg); cursor: pointer; min-width: 0; font: inherit; }
.cf-slot.on { border-style: solid; border-color: var(--gold); box-shadow: 0 0 14px #f5c51833; }
.cf-slot.cur { outline: 2px solid var(--cyan); outline-offset: 1px; }
.cf-slot .cf-emb.big { width: 46px; height: 46px; opacity: .5; }
.cf-slot-art { width: 46px; height: 62px; border-radius: 6px; overflow: hidden; position: relative; display: block; }
.cf-slot-art .cf-th { position: absolute; inset: 0; display: block; }
.cf-slot-art .cf-th > div { position: absolute; inset: 0; }
.cf-slot b { font: 700 11px var(--body); } .cf-slot small { font: 500 10px var(--body); color: var(--mut); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cf-slot i { position: absolute; top: 2px; right: 4px; font-style: normal; font-size: 11px; color: var(--mut); }
.cf-deck-tools { gap: 8px; }
.cf-tabs .chip .cf-emb { width: 18px; height: 18px; }
.cf-tab-pow { display: flex; gap: 6px; align-items: center; }
.cf-pool { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 14px; }
.cf-pick { position: relative; display: flex; flex-direction: column; gap: 6px; padding: 0; background: none; border: 0; color: var(--fg); cursor: pointer; text-align: center; font: inherit; transition: transform .15s; }
.cf-pick:hover { transform: translateY(-3px); }
.cf-pick .kcw { --w: 100%; }
.cf-pick.on .kc { box-shadow: 0 0 0 3px var(--gold), 0 0 24px #f5c51877; }
.cf-pick-b { font: 600 12px var(--body); color: var(--fg2); display: flex; gap: 4px; justify-content: center; align-items: center; } .cf-pick-b .cf-emb { width: 16px; height: 16px; }
.cf-pick-ok { position: absolute; top: 8px; left: 50%; transform: translateX(-50%); z-index: 4; background: var(--gold); color: #1a1405; font: 800 11px var(--body); padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
.cf-draft-go { position: sticky; bottom: calc(76px + env(safe-area-inset-bottom)); display: flex; justify-content: center; padding: 10px 0; background: linear-gradient(transparent, var(--bg) 40%); z-index: 5; }
@media (min-width: 900px) { .cf-draft-go { bottom: 12px; } }
/* arène : pioche et éléments, carte mise en avant, choix d'une carte adverse */
.ar-deck { cursor: pointer; padding: 0; font: inherit; }
.ar-deck em { position: absolute; top: -8px; right: -8px; width: 18px; height: 18px; border-radius: 50%; background: var(--ac); color: #04161a; font: 800 11px/18px var(--body); font-style: normal; text-align: center; }
.ar-elems { position: absolute; inset: -14px; pointer-events: none; }
.ar-elems i { position: absolute; width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; background: #0b0916; border: 1px solid var(--ec); color: var(--ec); }
.ar-elems i .ic { width: 12px; height: 12px; }
.ar-elems i:nth-child(1) { left: 0; top: 0; } .ar-elems i:nth-child(2) { right: 0; top: 0; } .ar-elems i:nth-child(3) { left: 0; bottom: 0; } .ar-elems i:nth-child(4) { right: 0; bottom: 0; }
.ar-elgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 10px; }
.ar-elgrid span { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 4px; border-radius: 10px; border: 1px solid color-mix(in srgb, var(--ec) 50%, transparent); color: var(--ec); }
.ar-elgrid .ic { width: 26px; height: 26px; } .ar-elgrid b { font: 700 12px var(--body); } .ar-elgrid small { font: 500 10px var(--body); color: var(--am); }
.ar-pres { display: flex; gap: 10px; align-items: flex-start; margin-bottom: 6px; } .ar-pres svg { width: 26px; height: 26px; flex: none; color: var(--ag); }
.ar-spot { position: absolute; inset: 0; z-index: 12; display: grid; place-items: center; background: #000a; animation: ar-rin .25s ease-out; cursor: pointer; }
.ar-spot.out { opacity: 0; transition: opacity .3s; }
.ar-spot-in { display: flex; flex-direction: column; align-items: center; gap: 10px; max-width: 280px; text-align: center; }
.ar-spot-in .cff { width: 200px; font-size: 15px; animation: ar-emo .5s cubic-bezier(.2,1.4,.4,1); }
.ar-spot-in p { margin: 0; font: 700 16px var(--disp); } .ar-spot-in small { font: 500 12px/1.4 var(--body); color: var(--am); }
.ar-cardpick { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); }
.ar-cp { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 8px; border-radius: 12px; border: 1px solid var(--aline); background: #120d22; color: var(--af); cursor: pointer; font: inherit; }
.ar-cp:hover { border-color: var(--ag); box-shadow: 0 0 16px #e8c77e44; }
.ar-cp .cff { width: 100%; }
.ar-cp small { font: 500 11px var(--body); color: var(--am); }
.ar-cp-back { position: relative; width: 100%; aspect-ratio: 5 / 7; border-radius: 10px; display: grid; place-items: center; background: radial-gradient(circle at 50% 45%, #3a2464, #0b0916); border: 2px solid var(--ag); color: var(--ag); }
.ar-cp-back .ic { width: 40%; height: auto; } .ar-cp-back b { position: absolute; bottom: 6px; font: 700 12px var(--body); }
@media (max-width: 600px) { .ar-side { flex-direction: row; align-items: center; } .ar-deck { display: grid !important; width: 40px; height: 58px; } .ar-elems { inset: -10px; } .ar-elems i { width: 16px; height: 16px; } }
.ar-omen .ar-need { color: #fff; font-size: 9px; letter-spacing: 0; margin-top: 1px; }

/* ===================== Le monde du QG : le site dans le même univers que la 3D (23/10/2026) =====================
   Fond : le temple de nuit de l'arène, fixe et assombri, qui se fond dans le noir des scènes 3D (pas de bascule).
   Panneaux en verre sombre, boutons comme dans l'arène, cartes qui s'inclinent et irisent comme les cartes 3D. */
html { background: #07060f; }
body { background: transparent; }
body::before { content: ""; position: fixed; inset: 0; z-index: -2; pointer-events: none;
  background: linear-gradient(180deg, #07060f55 0%, #07060fb0 38%, #07060f 72%), var(--world, none) 50% 0% / cover no-repeat, #07060f;
  filter: saturate(1.05); }
body::after { content: ""; position: fixed; left: 50%; bottom: -38vh; width: 160vw; height: 70vh; transform: translateX(-50%); z-index: -1; pointer-events: none; border-radius: 50%;
  background: radial-gradient(closest-side, transparent 78%, #e8c77e22 79%, transparent 80.5%, transparent 84%, #e8c77e14 85%, transparent 86%), radial-gradient(closest-side, #2a2338aa, #07060f00 70%); }
/* panneaux : verre sombre, on devine le monde derrière */
.card, .mbox, .sheet, .z-bar, .cf-row, .cf-howto, .np-panel, #notifPanel, .acc-stats > div, .lab-form, .test-zone {
  background: #0b0916c7 !important; -webkit-backdrop-filter: blur(10px) saturate(1.2); backdrop-filter: blur(10px) saturate(1.2);
  border-color: #e8c77e33 !important; box-shadow: inset 0 1px 0 #ffffff0d, 0 10px 30px #0006; }
.hd { background: #07060fcc; -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); }
/* boutons : comme dans l'arène (sombre à fin liseré, doré taillé pour l'action, rose plein pour quitter) */
.btn { background: #0b0916e6; border: 1px solid #e8c77e40; border-radius: 6px; box-shadow: inset 0 1px 0 #ffffff0f; }
.btn:hover:not(:disabled) { border-color: #e8c77e99; box-shadow: inset 0 1px 0 #ffffff14, 0 0 14px #e8c77e22; }
.btn.gold { border-radius: 0; }
.btn.acc { background: linear-gradient(180deg, #ff5aa5, #c4166a); border: 0; border-radius: 6px; color: #fff; }
/* cartes : épaisseur, inclinaison sous le doigt et reflet irisé qui suit, comme les cartes 3D */
.kcw { perspective: 900px; }
.kc { transform: rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)); transform-style: preserve-3d; transition: transform .25s ease-out, box-shadow .25s; }
.kc::before { content: ""; position: absolute; inset: 0; z-index: 2; pointer-events: none; border-radius: inherit; opacity: var(--shine, 0); transition: opacity .25s;
  background: radial-gradient(circle at var(--mx, 50%) var(--my, 30%), #ffffff40, transparent 45%),
    conic-gradient(from calc(var(--ry, 0deg) * 6) at var(--mx, 50%) var(--my, 30%), #ff2e8826, #2ee6ff26, #f5c51826, #b072ff26, #ff2e8826);
  mix-blend-mode: screen; }
.kcw.tilt .kc { transition: transform .08s linear, box-shadow .25s; box-shadow: 0 0 0 1px #ffffff14, 0 18px 40px #000a, 0 0 26px color-mix(in srgb, var(--rc) 45%, transparent); }
/* entrée dans une ouverture ou dans l'arène : fondu depuis le même noir, pas de coupure */
.o3, #ar-root:not([hidden]) { animation: world-in .5s ease-out both; }
@keyframes world-in { from { opacity: 0; filter: brightness(.4); } to { opacity: 1; filter: none; } }
@media (prefers-reduced-motion: reduce) { .kc { transform: none !important; } .o3, #ar-root { animation: none !important; } }

/* ===== Tout en relief (23/10/2026) : boutons physiques, pages qui arrivent en profondeur, panneaux qui se soulèvent ===== */
.btn { position: relative; overflow: hidden; background: linear-gradient(180deg, #221a3c 0%, #120d24 55%, #0b0916 100%);
  box-shadow: inset 0 1px 0 #ffffff26, inset 0 -3px 0 #00000080, 0 4px 0 #05040b, 0 8px 18px #000b;
  transition: transform .12s ease-out, box-shadow .12s ease-out, filter .15s, border-color .15s; text-shadow: 0 1px 0 #000a; }
.btn:hover:not(:disabled) { transform: translateY(-1px); box-shadow: inset 0 1px 0 #ffffff33, inset 0 -3px 0 #00000080, 0 5px 0 #05040b, 0 12px 24px #000c, 0 0 16px #e8c77e26; }
.btn:active:not(:disabled) { transform: translateY(3px); box-shadow: inset 0 1px 0 #ffffff1a, inset 0 -1px 0 #00000080, 0 1px 0 #05040b, 0 3px 8px #000b; }
.btn::after { content: ""; position: absolute; top: 0; bottom: 0; left: -60%; width: 40%; pointer-events: none; background: linear-gradient(100deg, transparent, #ffffff1f, transparent); transform: skewX(-18deg); transition: left .5s ease-out; }
.btn:hover:not(:disabled)::after { left: 120%; }
.btn.gold { background: linear-gradient(180deg, #fff1c2 0%, #f0d38c 16%, #d9b465 50%, #b88a3e 78%, #7a5820 92%, #5a3f12 100%); color: #1a1206; text-shadow: 0 1px 0 #fff6; box-shadow: none; }
.btn.gold:hover:not(:disabled) { filter: brightness(1.08) drop-shadow(0 0 10px #e8c77e66); box-shadow: none; }
.btn.gold:active:not(:disabled) { filter: brightness(.92); box-shadow: none; }
.btn.acc { background: linear-gradient(180deg, #ff8cc0 0%, #ff4d9a 20%, #e0207a 70%, #9a0e52 100%); box-shadow: inset 0 1px 0 #ffffff55, inset 0 -3px 0 #00000055, 0 4px 0 #5a0830, 0 8px 18px #000b, 0 0 18px #ff2e8855; text-shadow: 0 1px 0 #0006; }
.btn.acc:active:not(:disabled) { box-shadow: inset 0 1px 0 #ffffff33, 0 1px 0 #5a0830, 0 3px 8px #000b; }
.btn:disabled { box-shadow: inset 0 1px 0 #ffffff14, 0 2px 0 #05040b; }
/* barres du haut et du bas : épaisseur et reflet */
.hd { box-shadow: inset 0 -1px 0 #e8c77e33, 0 8px 24px #000a; }
.tabbar { background: linear-gradient(180deg, #1a1430f0, #0b0916f5) !important; box-shadow: inset 0 1px 0 #ffffff1f, inset 0 -2px 0 #0008, 0 10px 30px #000c !important; }
/* panneaux : ils se soulèvent un peu sous la souris */
.card, .mbox { transition: transform .2s ease-out, box-shadow .2s ease-out; }
@media (hover: hover) { .card:hover, .mbox:hover { transform: translateY(-2px); box-shadow: inset 0 1px 0 #ffffff14, 0 18px 40px #000a, 0 0 22px #e8c77e14; } }
/* titres : or gravé, en relief */
.page h1, .head h1, h1.h1 { text-shadow: 0 1px 0 #fff3, 0 2px 0 #b88a3e55, 0 6px 18px #000c; }
/* changement de page : le contenu arrive en profondeur (une fois par page, pas à chaque mise à jour) */
#view { perspective: 1400px; }
#view.v-enter > * { animation: v-in .55s cubic-bezier(.2, .8, .2, 1) both; transform-origin: 50% 0; }
#view.v-enter > *:nth-child(2) { animation-delay: .06s; } #view.v-enter > *:nth-child(3) { animation-delay: .12s; }
@keyframes v-in { from { opacity: 0; transform: translateZ(-120px) rotateX(7deg) translateY(18px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { #view.v-enter > * { animation: none; } .btn, .card, .mbox { transition: none; } }

/* ===== Tout en relief, suite : pastilles, onglets, icônes, textes, profil, champs ===== */
/* pastilles, puces, onglets, segments : des touches physiques */
.pill, .chip, .utabs button, .seg button, .qs > *, .wal, .mpill, .ib, .badge {
  background: linear-gradient(180deg, #221a3c, #0e0a1e) ; box-shadow: inset 0 1px 0 #ffffff1f, inset 0 -2px 0 #0009, 0 3px 0 #05040b, 0 6px 14px #0009;
  transition: transform .12s, box-shadow .12s; }
.chip:active, .utabs button:active, .seg button:active, .qs > button:active, .ib:active { transform: translateY(2px); box-shadow: inset 0 1px 0 #ffffff14, 0 1px 0 #05040b; }
.chip[aria-pressed="true"], .utabs button[aria-pressed="true"], .seg button[aria-pressed="true"] { background: linear-gradient(180deg, #3a2c16, #1e1608); box-shadow: inset 0 1px 0 #fff3, inset 0 -2px 0 #0009, 0 3px 0 #2a1d08, 0 0 14px #e8c77e33; }
/* icônes : en relief, avec une lueur douce */
.ic { filter: drop-shadow(0 1px 0 #0009) drop-shadow(0 0 4px color-mix(in srgb, currentColor 35%, transparent)); }
.qs .k, .k { box-shadow: inset 0 1px 0 #ffffff26, inset 0 -2px 0 #0008, 0 2px 0 #05040b, 0 0 12px color-mix(in srgb, var(--c, var(--gold)) 30%, transparent); }
/* textes : titres en or gravé, chiffres en relief */
h1, h2, .h2 { text-shadow: 0 1px 0 #ffffff2e, 0 2px 0 #00000080, 0 3px 0 #0006, 0 8px 22px #000d; }
h1 { background: linear-gradient(180deg, #fff8e8 0%, #f0e6d2 45%, #d9c49a 100%); -webkit-background-clip: text; background-clip: text; }
.eyebrow { text-shadow: 0 0 10px currentColor, 0 1px 0 #000; }
.qs b, .acc-stats b, .stats b, .pf-stats b { text-shadow: 0 1px 0 #fff3, 0 2px 0 #000a, 0 0 12px color-mix(in srgb, var(--c, var(--gold)) 40%, transparent); }
/* profil : avatar en médaillon et sceau en relief */
.pf-av, .av-btn { background: conic-gradient(from 210deg, #f0d38c, #6a4a14, #e8c77e, #3a2a10, #f0d38c); border: 0 !important; padding: 5px;
  box-shadow: inset 0 2px 2px #fff6, inset 0 -3px 4px #0009, 0 6px 0 #05040b, 0 14px 30px #000c, 0 0 30px #e8c77e33; }
.pf-av img, .pf-av span, .av-btn #avImg { box-shadow: inset 0 3px 8px #000c; }
.seal { filter: drop-shadow(0 3px 0 #05040b) drop-shadow(0 8px 16px #000c); }
.pf-head { perspective: 1000px; }
/* champs de saisie : creusés dans le verre */
input[type="text"], input[type="search"], input:not([type]), textarea, select, .in, .search input {
  background: #07060fe6 !important; box-shadow: inset 0 3px 6px #000c, inset 0 -1px 0 #ffffff14 !important; border-color: #e8c77e33 !important; }

/* ===== Relief partout, suite : menu, Sanctuaire (autels), tirage d'un objet, rubriques ===== */
/* tuiles en relief : menu, compte, listes, onglets de gestion */
.mgrid button, .acc-stats > div, .gest-tabs button, .rank-list > *, .adm-row, .zrates span, .def-e, .cf-br, .rl-card, .ach, .ttl-i, .mr, .np-item {
  background: linear-gradient(180deg, #1f1838 0%, #120d24 60%, #0b0916 100%) !important; border: 1px solid #e8c77e2e !important;
  box-shadow: inset 0 1px 0 #ffffff1c, inset 0 -3px 0 #0009, 0 4px 0 #05040b, 0 10px 22px #000a; transition: transform .14s, box-shadow .14s, border-color .14s; }
.mgrid button:hover, .gest-tabs button:hover, .np-item:hover, .cf-br:hover, .rl-card:hover { transform: translateY(-2px); border-color: #e8c77e66 !important; box-shadow: inset 0 1px 0 #ffffff26, inset 0 -3px 0 #0009, 0 6px 0 #05040b, 0 16px 28px #000b, 0 0 18px #e8c77e1f; }
.mgrid button:active, .gest-tabs button:active, .np-item:active { transform: translateY(3px); box-shadow: inset 0 1px 0 #ffffff14, 0 1px 0 #05040b; }
.mgrid button[aria-current="page"] { border-color: #ff2e88 !important; box-shadow: inset 0 1px 0 #ffffff26, inset 0 -3px 0 #0009, 0 4px 0 #4a0828, 0 0 22px #ff2e8844; }
.mgrid button i { filter: drop-shadow(0 0 6px color-mix(in srgb, currentColor 45%, transparent)); }
.menu { background: #0b0916d9 !important; -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); box-shadow: 0 20px 60px #000d, inset 0 1px 0 #ffffff14; }
.acc-card { background: linear-gradient(180deg, #241a44, #0e0a1e) !important; box-shadow: inset 0 1px 0 #ffffff26, 0 6px 0 #05040b, 0 16px 30px #000b; }
.ring-av { border: 0 !important; background: conic-gradient(from 210deg, #f0d38c, #6a4a14, #e8c77e, #3a2a10, #f0d38c); box-shadow: inset 0 2px 2px #fff6, inset 0 -2px 3px #0009, 0 4px 0 #05040b, 0 0 20px #e8c77e33; }

/* Sanctuaire : chaque offre est un autel, l'objet flotte au-dessus d'un socle de runes */
.zoffers { perspective: 1100px; }
.zoffer { transform-style: preserve-3d; overflow: visible; background: linear-gradient(180deg, #1f1838 0%, #0e0a1e 70%, #07060f 100%) !important;
  box-shadow: inset 0 1px 0 #ffffff1f, inset 0 -4px 0 #0009, 0 6px 0 #05040b, 0 20px 40px #000c; transition: transform .25s ease-out, box-shadow .25s; }
.zoffer:hover:not(:disabled) { transform: translateY(-6px) rotateX(6deg); box-shadow: inset 0 1px 0 #ffffff2a, inset 0 -4px 0 #0009, 0 10px 0 #05040b, 0 30px 50px #000d, 0 0 40px #b072ff44; }
.zoffer.n10:hover:not(:disabled) { box-shadow: inset 0 1px 0 #ffffff2a, inset 0 -4px 0 #0009, 0 10px 0 #05040b, 0 30px 50px #000d, 0 0 40px #f5c51844; }
.zo-art { position: relative; height: 150px; transform-style: preserve-3d; }
.zo-art::before { content: ""; position: absolute; left: 50%; bottom: -52px; width: 150px; height: 150px; transform: translateX(-50%) rotateX(72deg); border-radius: 50%;
  background: radial-gradient(closest-side, color-mix(in srgb, var(--zc, #b072ff) 55%, transparent), transparent 70%), repeating-conic-gradient(from 0deg, #e8c77e55 0 4deg, transparent 4deg 22deg);
  -webkit-mask: radial-gradient(closest-side, #000 60%, transparent 62%, transparent 74%, #000 76%, #000 92%, transparent 94%); mask: radial-gradient(closest-side, #000 60%, transparent 62%, transparent 74%, #000 76%, #000 92%, transparent 94%);
  animation: z-runes 12s linear infinite; }
