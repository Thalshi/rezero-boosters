.chart { width: 100%; height: 170px; }
.kv3 { display: flex; gap: 22px; flex-wrap: wrap; }
.kv3 small { display: block; font-size: 12px; color: var(--fg2); }
.kv3 b { font: 900 20px var(--disp); }

/* ---------- missions ---------- */
.mbox { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-xl); padding: 22px; display: flex; flex-direction: column; gap: 14px; }
.mbox-h { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
.mbox-h .eyebrow { color: var(--mut); }
.mbox-h h2 { font-size: 22px; margin-top: 4px; }
.days { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.day { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 0 8px; border-radius: var(--r-lg); border: 1px solid var(--line2); background: var(--bg2); font: 500 13px var(--mono); color: var(--fg2); min-width: 0; }
.day i { width: 26px; height: 26px; border-radius: 50%; border: 1px solid var(--line3); display: grid; place-items: center; font: 500 13px var(--body); font-style: normal; color: var(--fg2); }
.day.now { border-color: var(--gold); background: #f5c5180f; box-shadow: 0 0 18px #f5c51833; color: var(--fg); }
.day.now i, .day.last i { border-color: var(--gold); color: var(--gold); background: #f5c5181a; }
.day.done { border-color: #3fbf7f66; }
.day.done i { background: var(--ok); border-color: var(--ok); color: #071a10; }
.day span { font: 500 12px var(--mono); color: var(--fg); white-space: nowrap; }
.mr { display: grid; grid-template-columns: 1fr auto; gap: 6px 16px; align-items: center; padding: 14px; border-radius: var(--r-lg); border: 1px solid var(--line); background: var(--bg2); }
.mr.claimed { opacity: .5; }
.mr .t { display: flex; justify-content: space-between; gap: 10px; font: 700 14px var(--body); }
.mr .t span { font: 500 12px var(--mono); color: var(--fg2); flex: none; }
.mr .bar { height: 5px; border-radius: 5px; background: var(--line2); overflow: hidden; grid-column: 1; }
.mr .bar i { display: block; height: 100%; background: var(--cyan); }
.mr .rw { font: 700 14px var(--mono); color: var(--cyan); grid-column: 1; display: flex; align-items: center; gap: 6px; }
.mr .rw .dia { background: var(--cyan); border: 0; width: 10px; height: 10px; }
.mr .s { grid-column: 2; grid-row: 1 / span 3; font: 500 13px var(--mono); color: var(--fg2); }
.mbonus { border-top: 1px dashed var(--line3); padding-top: 12px; font-size: 13px; color: var(--fg2); display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.ach { display: flex; gap: 16px; padding: 16px; border-radius: var(--r-xl); border: 1px solid var(--line); background: var(--panel); }
.ach .ic { width: 44px; height: 44px; border-radius: var(--r-md); border: 1px solid var(--line2); display: grid; place-items: center; font: 500 18px var(--body); color: var(--dim); flex: none; }
.ach.ok .ic { border-color: var(--gold); color: var(--gold); background: #f5c51814; }
.ach .bd { flex: 1; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.ach b { font: 700 15px var(--body); }
.ach p { margin: 0; font-size: 14px; color: var(--fg2); }
.ach .bar { height: 5px; border-radius: 5px; background: var(--line2); overflow: hidden; }
.ach .bar i { display: block; height: 100%; background: var(--gold); }
.ach small { font: 500 12px var(--mono); color: var(--fg2); }
.ach .btn { align-self: center; }

/* ---------- prédictions ---------- */
.pq { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-xl); padding: 20px; display: flex; flex-direction: column; gap: 14px; }
.pq.open { border-color: #b072ff55; }
.pq-h { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.pq h3 { font-size: 18px; line-height: 1.35; }
.pq-o { display: flex; flex-direction: column; gap: 8px; }
.pq-o button { position: relative; overflow: hidden; display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 10px 16px; border-radius: var(--r-lg); border: 1px solid var(--line2); background: var(--bg2); font: 700 15px var(--body); text-align: left; cursor: pointer; color: var(--fg); }
.pq-o button:disabled { cursor: default; }
.pq-o button .fill { position: absolute; inset: 0 auto 0 0; background: #b072ff1f; z-index: 0; }
.pq-o button > * { position: relative; z-index: 1; }
.pq-o button em { margin-left: auto; font: 500 12px var(--mono); color: var(--fg2); font-style: normal; }
.pq-o button.mine { border-color: var(--r-e); box-shadow: 0 0 0 1px var(--r-e) inset; }
.pq-o button.good { border-color: var(--ok); background: #3fbf7f14; }
.pq-o button.bad { border-color: var(--danger); }
.pq-res { font-size: 14px; color: var(--fg2); margin: 0; }
.pq-adm { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; border-top: 1px dashed var(--line3); padding-top: 12px; }
.pq-adm select, .pq-adm input { height: 36px; border-radius: 999px; padding: 0 12px; background: var(--bg2); border: 1px solid var(--line2); color: var(--fg); font: 500 13px var(--body); }
.pq-adm input { width: 90px; }
.adm-list { display: flex; flex-direction: column; gap: 8px; }
.adm-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 10px 12px; border-radius: var(--r-lg); background: var(--bg2); border: 1px solid var(--line); }
.adm-row .who { flex: 1; }
.adm-row select { height: 36px; border-radius: 999px; padding: 0 12px; background: var(--panel); border: 1px solid var(--line2); color: var(--fg); }
.adm-name { flex: 1; } .adm-name b { display: block; } .adm-name span { font-size: 12px; color: var(--mut); }
.adm-checks { display: flex; flex-direction: column; gap: 6px; max-height: 50vh; overflow-y: auto; }
.adm-checks label { display: flex; gap: 10px; align-items: center; padding: 8px 10px; border-radius: var(--r-md); background: var(--bg2); font-size: 14px; }
.adm-checks span { margin-left: auto; color: var(--mut); font-size: 12px; }

/* ---------- fiche perso, profil ---------- */
.crumb { font-size: 14px; color: var(--fg2); display: flex; gap: 10px; flex-wrap: wrap; }
.crumb button { background: none; border: 0; padding: 0; color: var(--fg2); cursor: pointer; font-size: 14px; }
.crumb i { font-style: normal; color: var(--dim); }
.wk-head { position: relative; overflow: hidden; padding: 32px 0 30px; border-bottom: 1px solid var(--line); background: repeating-linear-gradient(135deg, #ffffff05 0 2px, transparent 2px 14px); }
.wk-head .ghost { position: absolute; right: -10px; top: 0; font: 900 120px/1 var(--body); color: #ffffff08; writing-mode: vertical-rl; pointer-events: none; }
.wk-grid { display: grid; gap: 24px; }
@media (min-width: 900px) { .wk-grid { grid-template-columns: 360px 1fr; align-items: start; } }
.wk-card { display: flex; flex-direction: column; align-items: center; gap: 14px; }
.wk-card .kcw { --w: 260px; }
.facts { display: grid; grid-template-columns: 130px 1fr; gap: 12px 16px; margin: 0; font-size: 15px; }
.facts dt { color: var(--mut); font-weight: 700; font-size: 13px; text-transform: uppercase; letter-spacing: .06em; }
.facts dd { margin: 0; color: var(--fg); }
.quotes q { display: block; font-style: italic; color: var(--fg2); margin-bottom: 6px; }
.pf-head { position: relative; padding: 40px 0 10px; background: radial-gradient(60% 80% at 20% 0%, #ff4d2e1c, transparent 70%); }
.pf-av { width: 150px; height: 150px; border-radius: 50%; padding: 4px; border: 2px solid var(--r-r); }
.pf-av img, .pf-av span { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; background: var(--raise); display: grid; place-items: center; font: 900 50px var(--disp); }
.pf-name { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.seal { display: inline-flex; flex-direction: column; align-items: center; }
.seal b { padding: 2px 10px; border-radius: 6px; background: linear-gradient(180deg, #e8384a, #a01628); border: 2px solid #f5c518; color: #fff; font: 700 18px var(--body); transform: rotate(-4deg); box-shadow: 0 4px 12px #a0162866; }
.seal small { font: 700 10px var(--mono); color: var(--gold); letter-spacing: .1em; margin-top: 2px; }
.stat4 { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
@media (min-width: 900px) { .stat4 { grid-template-columns: repeat(4, 1fr); } }
.stat4 b { display: block; font: 900 30px/1 var(--disp); }
.stat4 b small { color: var(--dim); font-size: inherit; }
.stat4 span { font: 500 12px var(--body); text-transform: uppercase; color: var(--fg2); letter-spacing: .04em; }
.stat4 .acc b { color: var(--acc); }
.rarbars { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
@media (min-width: 900px) { .rarbars { grid-template-columns: repeat(6, 1fr); } }
.rarbars div { padding: 10px 12px; border-radius: var(--r-md); background: var(--bg2); border: 1px solid var(--line); }
.rarbars small { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--fg2); }
.rarbars small i { width: 7px; height: 7px; border-radius: 50%; background: var(--c); }
.rarbars b { font: 700 18px var(--mono); }
.vitrine { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
@media (min-width: 900px) { .vitrine { grid-template-columns: repeat(4, minmax(0, 1fr)); max-width: 900px; } }
.rar-ex { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
@media (min-width: 900px) { .rar-ex { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (min-width: 1200px) { .rar-ex { grid-template-columns: repeat(6, minmax(0, 1fr)); } }
.rar-ex h3 { display: flex; align-items: center; gap: 8px; font-size: 16px; margin-top: 8px; }
.rar-ex h3 i { width: 10px; height: 10px; border-radius: 50%; background: var(--c); }
.rar-ex p { margin: 2px 0 0; font-size: 13px; color: var(--fg2); }
.rar-ex .mono { font-size: 13px; color: var(--fg); }
.rules { display: flex; flex-direction: column; gap: 14px; max-width: 760px; counter-reset: r; }
.rules li { list-style: none; padding: 16px 18px 16px 58px; position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-xl); color: var(--fg2); font-size: 15px; }
.rules li::before { counter-increment: r; content: counter(r, decimal-leading-zero); position: absolute; left: 18px; top: 16px; font: 900 18px var(--disp); color: var(--acc); }
.rules li b { color: var(--fg); }
.prose { max-width: 760px; display: flex; flex-direction: column; gap: 14px; color: var(--fg2); font-size: 16px; }
.prose h2 { color: var(--fg); margin-top: 20px; font-size: 22px; }
.prose p { margin: 0; }
.log { display: flex; flex-direction: column; gap: 10px; max-width: 760px; }
.log h3 { font-size: 16px; margin-top: 18px; color: var(--fg); }
.log h3 small { font: 500 13px var(--mono); color: var(--mut); margin-left: 8px; }
.log div { display: flex; gap: 12px; padding: 12px 14px; border-radius: var(--r-lg); background: var(--panel); border: 1px solid var(--line); font-size: 14px; color: var(--fg2); }
.log div em { font-style: normal; font: 700 12px var(--body); padding: 2px 8px; border-radius: 6px; height: fit-content; white-space: nowrap; }
.log .n em { background: #3fbf7f22; color: var(--ok); } .log .a em { background: #4d9bff22; color: var(--r-r); } .log .c em { background: #ff4d2e22; color: var(--acc); }
.starpick { display: flex; gap: 6px; }
.starpick button { width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--line2); background: var(--bg2); color: var(--dim); font-size: 20px; cursor: pointer; }
.starpick button.on { color: var(--gold); border-color: #f5c51866; }

/* ---------- fenêtres ---------- */
.overlay { position: fixed; inset: 0; z-index: 60; background: rgba(5,5,8,.72); display: flex; align-items: flex-end; justify-content: center; backdrop-filter: blur(3px); }
@media (min-width: 700px) { .overlay { align-items: center; padding: 24px; } }
.sheet { width: 100%; max-width: 560px; max-height: 92vh; overflow-y: auto; background: var(--panel); border: 1px solid var(--line2); border-radius: 22px 22px 0 0; display: flex; flex-direction: column; animation: up .22s ease-out; }
@media (min-width: 700px) { .sheet { border-radius: 22px; } }
@keyframes up { from { transform: translateY(30px); opacity: 0; } to { transform: none; opacity: 1; } }
.sheet-h { display: flex; align-items: center; justify-content: space-between; padding: 18px 20px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--panel); z-index: 2; }
.sheet-h h2 { font-size: 20px; }
.sheet-b { padding: 20px; display: flex; flex-direction: column; gap: 16px; }
.sheet-b .kcw { --w: 220px; align-self: center; }
.x { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line2); background: var(--bg2); color: var(--fg); cursor: pointer; display: grid; place-items: center; font-size: 18px; }
.box2 { display: flex; justify-content: space-between; padding: 16px; border: 1px solid var(--line2); border-radius: var(--r-lg); }
.box2 small { display: block; font-size: 12px; color: var(--fg2); }
.box2 b { font: 900 32px/1.1 var(--disp); display: flex; align-items: center; gap: 8px; }
.box2 .st { text-align: right; } .box2 .st b { font: 500 24px var(--mono); }
.toast { position: fixed; left: 50%; bottom: 84px; transform: translateX(-50%); z-index: 80; padding: 12px 18px; border-radius: 999px; background: var(--fg); color: var(--bg); font: 700 14px var(--body); box-shadow: var(--sh-2); max-width: calc(100% - 32px); text-align: center; }

/* ---------- notifications et chat (comptoir) ---------- */
.np { position: fixed; z-index: 45; top: 72px; right: 12px; width: min(400px, calc(100vw - 24px)); max-height: min(72vh, 600px); overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 8px; background: var(--panel); border: 1px solid var(--line2); border-radius: var(--r-xl); box-shadow: var(--sh-2); }
.np-head { display: flex; justify-content: space-between; align-items: center; }
.np-head b { font: 700 17px var(--disp); }
.linkbtn { background: none; border: 0; padding: 0; color: var(--acc); font: 700 13px var(--body); cursor: pointer; }
.np-sec { margin-top: 8px; font: 500 11px var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--mut); }
.np-item { display: flex; gap: 12px; align-items: flex-start; width: 100%; padding: 12px; border-radius: var(--r-lg); background: var(--bg2); border: 1px solid var(--line); color: var(--fg); font: 500 14px/1.45 var(--body); text-align: left; cursor: pointer; }
.np-item.unread { border-color: #ff4d2e66; background: #ff4d2e0d; }
.np-item small { display: block; font: 500 11px var(--mono); color: var(--mut); margin-top: 2px; }
.np-ic { flex: none; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-style: normal; font: 700 13px var(--body); background: var(--raise); color: var(--fg2); }
.np-ic.k-sold { color: var(--cyan); } .np-ic.k-trade { color: var(--ok); } .np-ic.k-mention { color: var(--wish); } .np-ic.k-episode, .np-ic.k-announce { color: var(--gold); } .np-ic.k-pred { color: var(--r-e); } .np-ic.todo { background: var(--acc); color: #1a0c0a; }
.chat { position: fixed; z-index: 50; right: 0; top: 0; bottom: 0; width: min(420px, 100vw); display: flex; flex-direction: column; background: var(--bg2); border-left: 1px solid var(--line2); box-shadow: var(--sh-2); }
.chat-head { display: flex; align-items: center; gap: 12px; padding: 16px 18px; border-bottom: 1px solid var(--line); }
.chat-head h2 { font-size: 20px; flex: 1; }
.chat-head h2 small { display: block; font: 500 11px var(--mono); letter-spacing: .14em; color: var(--acc); text-transform: uppercase; }
.chat-x { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line2); background: var(--panel); color: var(--fg); cursor: pointer; font-size: 18px; }
.chat-list { flex: 1; overflow-y: auto; padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; }
.cm { display: flex; gap: 10px; align-items: flex-start; }
.cm .av { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; flex: none; border: 2px solid var(--line3); background: var(--raise); }
.cm-b { flex: 1; min-width: 0; }
.cm-h { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; }
.cm-h b { font: 700 14px var(--body); cursor: pointer; }
.cm.me .cm-h b { color: var(--acc); }
.cm-h time { font: 500 11px var(--mono); color: var(--mut); }
.tagadm { padding: 0 6px; border-radius: 4px; background: var(--gold); color: #1a1405; font: 700 10px/16px var(--body); font-style: normal; }
.cm-del { margin-left: auto; background: none; border: 0; color: var(--mut); cursor: pointer; opacity: .5; }
.cm-del:hover { opacity: 1; color: var(--danger); }
.cm p { margin: 2px 0 0; font-size: 15px; line-height: 1.45; overflow-wrap: anywhere; color: var(--fg); }
.cm p mark { background: #ff4d9e22; color: var(--wish); border-radius: 4px; padding: 0 3px; }
.cm.ping .cm-b { border-left: 2px solid var(--wish); padding-left: 8px; }
.cm.sys { justify-content: center; flex-wrap: wrap; gap: 6px; align-items: center; padding: 10px; border-radius: var(--r-lg); background: var(--panel); border: 1px solid var(--line); font: 500 12px var(--mono); color: var(--fg2); }
.cm.sys.ann { justify-content: flex-start; border-color: #f5c51866; background: #f5c5180d; color: var(--fg); font: 500 14px var(--body); }
.cm.sys.ann b { font: 700 11px var(--mono); color: var(--gold); text-transform: uppercase; letter-spacing: .12em; margin-right: 6px; }
.cm.sys.pull { border-color: #ff4d2e55; }
.cchip { display: inline-flex; align-items: center; gap: 10px; margin-top: 6px; padding: 5px 12px 5px 5px; max-width: 100%; border-radius: var(--r-md); background: var(--panel); border: 1px solid var(--cc, var(--line2)); color: var(--fg); font: 700 13px var(--body); cursor: pointer; text-align: left; }
.cchip .th { position: relative; width: 30px; height: 40px; border-radius: 5px; overflow: hidden; flex: none; background: var(--raise); display: grid; place-items: center; }
.cchip .th .layer, .cchip .th .photo { position: absolute; inset: 0; background-size: cover; background-position: 50% 22%; }
.cchip em { display: block; font: 700 11px var(--body); font-style: normal; color: var(--cc); }
.chat-foot { padding: 12px 14px calc(12px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
.chat-form { display: flex; gap: 6px; }
.chat-form input { flex: 1; min-width: 0; height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--line2); background: var(--panel); color: var(--fg); font: 500 15px var(--body); }
.chat-form input:focus { outline: none; border-color: var(--line3); }
.chat-att { display: flex; align-items: center; gap: 8px; }
.chat-empty { margin: auto; text-align: center; color: var(--mut); font-size: 14px; max-width: 280px; }

/* ---------- ouverture ---------- */
.stage-wrap { position: fixed; inset: 0; z-index: 55; background: radial-gradient(60% 45% at 50% 42%, color-mix(in srgb, var(--glow, #f5c518) 22%, transparent), transparent 70%), #08070b; display: flex; flex-direction: column; overflow-y: auto; }
.stage-top { display: flex; align-items: center; gap: 10px; padding: 14px var(--g); }
.stage-top .back { width: 40px; height: 40px; border-radius: 50%; border: 0; background: none; color: var(--fg); font-size: 22px; cursor: pointer; }
.stage-top .wal { margin: 0 auto; cursor: default; }
.stage { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 10px var(--g) 30px; text-align: center; }
.stage .hint { color: var(--fg2); font-size: 15px; }
.stage .hint b { color: var(--fg); }
.stage .sub { font: 500 13px var(--mono); color: var(--mut); }
.stage #pack { width: 230px; container-type: inline-size; }
.stage .bst { width: 100%; transform: none; touch-action: none; cursor: grab; transition: transform .1s; }
.stage .bst .cord { position: absolute; top: 0; left: 0; right: 0; height: 18%; border-bottom: 2px dashed rgba(0,0,0,.35); }
.bst.tear { animation: tear .55s ease-in forwards; }
@keyframes tear { 40% { transform: translateY(-10px) rotate(-2deg); } 100% { transform: translateY(-140px) scale(1.15); opacity: 0; filter: brightness(2.2); } }
.floor { width: 260px; height: 26px; border-radius: 50%; background: radial-gradient(closest-side, rgba(0,0,0,.65), transparent); margin-top: -16px; }
.sparks { position: fixed; inset: 0; pointer-events: none; z-index: 56; }
.sparks i { position: absolute; left: 50%; top: 45%; width: 6px; height: 6px; border-radius: 50%; background: var(--glow, #f5c518); box-shadow: 0 0 10px var(--glow, #f5c518); animation: spark .9s ease-out forwards; }
@keyframes spark { to { transform: rotate(var(--a)) translateY(-46vh); opacity: 0; } }
.flash { position: fixed; inset: 0; z-index: 57; background: radial-gradient(circle, color-mix(in srgb, var(--glow, #fff) 70%, #fff), transparent 70%); animation: flash .8s ease-out forwards; pointer-events: none; }
@keyframes flash { from { opacity: .95; } to { opacity: 0; } }
.reveal { perspective: 1200px; }
.reveal-card { width: 250px; aspect-ratio: 5 / 7.4; position: relative; border: 0; padding: 0; background: none; cursor: pointer; }
.reveal-card .in { position: absolute; inset: 0; width: auto; height: auto; padding: 0; border: 0; border-radius: 0; background: none; transform-style: preserve-3d; transition: transform .6s cubic-bezier(.2,.7,.2,1); }
.reveal-card.on .in { transform: rotateY(180deg); }
.reveal-card .face { position: absolute; inset: 0; backface-visibility: hidden; }
.reveal-card .face.front { transform: rotateY(180deg); }
.reveal-card .face.front .kcw { --w: 250px; }
.cardback { width: 100%; height: 100%; border-radius: 16px; border: 3px solid var(--line3); background: radial-gradient(circle at 50% 45%, #2a1410, #0e0d12 70%); display: grid; place-items: center; box-shadow: 0 0 var(--gl, 0) var(--rc, transparent); }
.cardback::after { content: ""; width: 46%; aspect-ratio: 1; border-radius: 50%; border: 3px solid var(--acc); box-shadow: 0 0 30px #ff4d2e55; background: var(--acc) content-box; padding: 18%; box-sizing: border-box; -webkit-mask: url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2024%2024%22%20fill%3D%22none%22%20stroke%3D%22%23000%22%20stroke-width%3D%221.5%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cpath%20d%3D%22M12%202l8.5%205v10L12%2022l-8.5-5V7z%22/%3E%3Ccircle%20cx%3D%2212%22%20cy%3D%2212%22%20r%3D%224.5%22/%3E%3Cpath%20d%3D%22M12%204.8v2.7M12%2016.5v2.7M5.6%208.4l2.4%201.4M16%2014.2l2.4%201.4%22/%3E%3C/svg%3E") center / 64% no-repeat, linear-gradient(#000 0 0) border-box exclude; mask: url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2024%2024%22%20fill%3D%22none%22%20stroke%3D%22%23000%22%20stroke-width%3D%221.5%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cpath%20d%3D%22M12%202l8.5%205v10L12%2022l-8.5-5V7z%22/%3E%3Ccircle%20cx%3D%2212%22%20cy%3D%2212%22%20r%3D%224.5%22/%3E%3Cpath%20d%3D%22M12%204.8v2.7M12%2016.5v2.7M5.6%208.4l2.4%201.4M16%2014.2l2.4%201.4%22/%3E%3C/svg%3E") center / 64% no-repeat; }
.reveal.big .cardback { --gl: 40px; animation: pulse 1s ease-in-out infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 60px var(--rc); } }
.rays { position: absolute; left: 50%; top: 50%; width: 720px; height: 720px; margin: -360px 0 0 -360px; background: repeating-conic-gradient(from 0deg, color-mix(in srgb, var(--rc) 35%, transparent) 0 6deg, transparent 6deg 18deg); border-radius: 50%; mask: radial-gradient(circle, #000 20%, transparent 65%); -webkit-mask: radial-gradient(circle, #000 20%, transparent 65%); animation: spin 14s linear infinite; pointer-events: none; opacity: 0; transition: opacity .4s; }
.reveal.on.big .rays { opacity: 1; }
@keyframes spin { to { transform: rotate(360deg); } }
.pdots { display: flex; gap: 6px; }
.pdots i { width: 22px; height: 4px; border-radius: 4px; background: var(--line3); }
.pdots i.on { background: var(--gold); }
.summary { display: grid; grid-template-columns: repeat(3, minmax(0, 120px)); gap: 12px; justify-content: center; width: 100%; }
@media (min-width: 700px) { .summary { grid-template-columns: repeat(5, minmax(0, 160px)); } }
.divine { padding: 6px 16px; border-radius: 999px; background: linear-gradient(90deg, #ff4d9e, #b072ff, #4dd6ff); color: #fff; font: 700 14px var(--disp); }
/* coffre hextech (pack Coffre) */
.chest { position: relative; width: 210px; height: 190px; border: 0; background: none; cursor: pointer; }
.chest .lid, .chest .box { position: absolute; left: 10px; right: 10px; border-radius: 14px; background: linear-gradient(180deg, #4a2a80, #1e0f38); border: 3px solid #c8aa6e; }
.chest .box { bottom: 0; height: 110px; }
.chest .lid { bottom: 106px; height: 64px; border-radius: 40px 40px 10px 10px; transform-origin: 50% 100%; }
.chest .gem { position: absolute; left: 50%; bottom: 84px; width: 36px; height: 36px; margin-left: -18px; transform: rotate(45deg); background: #4dd6ff; border: 3px solid #c8aa6e; box-shadow: 0 0 24px #4dd6ff; z-index: 2; }
.chest.shake { animation: shake .5s linear; }
.chest.out .lid { transform: translateY(-40px) rotate(-18deg); opacity: 0; transition: all .5s; }
@keyframes shake { 20% { transform: rotate(-4deg); } 40% { transform: rotate(4deg); } 60% { transform: rotate(-3deg); } 80% { transform: rotate(3deg); } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

/* ===== Cosmétiques (Atelier Arcanique) : aucun bonus, jamais par-dessus le visage ===== */
.kc.cz-cadre { border-color: transparent; }
.kc.cz-cadre-neon { box-shadow: 0 0 14px var(--zf1), 0 8px 20px #0007; }
.kc.cz-cadre-gem { box-shadow: inset 0 0 0 1px #fff3, 0 0 10px color-mix(in srgb, var(--zf1) 60%, transparent), 0 8px 20px #0007; }
@property --zang { syntax: "<angle>"; inherits: true; initial-value: 0deg; }
.kc.cz-cadre-prisme { animation: zspin 6s linear infinite; }
@keyframes zspin { to { --zang: 360deg; } }
.kcw.cz-aura { isolation: isolate; }
.kcw.cz-aura::before { content: ""; position: absolute; inset: -7%; z-index: -1; border-radius: 10cqw; background: radial-gradient(closest-side, var(--za), transparent); opacity: .55; filter: blur(4px); pointer-events: none; }
.kcw.cz-aura-pulse::before { animation: zpulse 2.6s ease-in-out infinite; }
.kcw.cz-aura-flow::before { background: conic-gradient(from var(--zang, 0deg), var(--za), transparent 30%, var(--za) 55%, transparent 80%, var(--za)); filter: blur(7px); animation: zspin 5s linear infinite; opacity: .6; }
@keyframes zpulse { 50% { opacity: .85; transform: scale(1.03); } }
.cz-orn { position: absolute; z-index: 4; left: 50%; top: -9cqw; transform: translateX(-50%); color: var(--zo); pointer-events: none; display: grid; place-items: center; filter: drop-shadow(0 0 4px color-mix(in srgb, var(--zo) 70%, transparent)); }
.cz-orn-etoile, .cz-orn-kanji { font: 900 14cqw/1 var(--body); animation: zfloat 3s ease-in-out infinite; }
.cz-orn-couronne svg { width: 30cqw; height: 17cqw; }
.cz-orn-aureole { top: -7cqw; width: 46cqw; height: 11cqw; border-radius: 50%; border: 1.6cqw solid var(--zo); box-shadow: 0 0 10px var(--zo); animation: zfloat 3.4s ease-in-out infinite; }
.cz-orn-cornes { top: -6cqw; width: 70cqw; height: 16cqw; }
.cz-orn-cornes::before, .cz-orn-cornes::after { content: ""; position: absolute; top: 0; width: 13cqw; height: 16cqw; border: 2.4cqw solid #ff4d5e; border-color: var(--zo) var(--zo) transparent transparent; border-radius: 0 100% 0 0; background: none; }
.cz-orn-cornes::before { left: 0; transform: scaleX(-1); } .cz-orn-cornes::after { right: 0; }
.cz-orn-ailes { top: 14%; width: 150%; height: 60%; z-index: -1; filter: drop-shadow(0 0 6px color-mix(in srgb, var(--zo) 60%, transparent)); }
.kcw:has(.cz-orn-ailes) { isolation: isolate; }
.cz-orn-ailes::before, .cz-orn-ailes::after { content: ""; position: absolute; top: 0; width: 34%; height: 100%; background: repeating-linear-gradient(170deg, var(--zo) 0 18%, color-mix(in srgb, var(--zo) 70%, transparent) 18% 24%); border-radius: 100% 0 100% 30%; opacity: .9; animation: zflap 2.8s ease-in-out infinite; }
.cz-orn-ailes::before { left: 0; transform-origin: 100% 40%; } .cz-orn-ailes::after { right: 0; transform: scaleX(-1); transform-origin: 0 40%; }
@keyframes zflap { 50% { transform: rotate(-6deg); } }
.cz-orn-ailes::after { animation-name: zflap2; } @keyframes zflap2 { 0%, 100% { transform: scaleX(-1); } 50% { transform: scaleX(-1) rotate(-6deg); } }
@keyframes zfloat { 50% { translate: 0 -1.5cqw; } }
.cz-holo { position: absolute; inset: 0; z-index: 1; pointer-events: none; mix-blend-mode: color-dodge; opacity: .26; background-size: 260% 100%; animation: holo 7s linear infinite; }
.cz-holo-nacre { background-image: linear-gradient(115deg, #ffd6f0, #d6f0ff, #fff6d6, #e0d6ff, #ffd6f0); }
.cz-holo-arcenciel { background-image: linear-gradient(115deg, #ff4d4d, #ffd24d, #4dff88, #4dd6ff, #a04dff, #ff4d4d); opacity: .22; }
.cz-holo-scintille { background-image: radial-gradient(2px 2px at 20% 30%, #fff, transparent), radial-gradient(2px 2px at 60% 70%, #fff, transparent), radial-gradient(1.5px 1.5px at 80% 25%, #fff, transparent), radial-gradient(2px 2px at 35% 85%, #fff, transparent); background-size: 100% 100%; opacity: .6; mix-blend-mode: screen; animation: ztwinkle 1.8s steps(2) infinite; }
.cz-holo-prisme { background-image: conic-gradient(from 0deg at 30% 30%, #ff4d9e, #ffd24d, #4dd6ff, #8a4dff, #ff4d9e); background-size: 100% 100%; opacity: .2; animation: zhue 5s linear infinite; }
.cz-holo-glitch { background-image: repeating-linear-gradient(0deg, #8a4dff33 0 2px, transparent 2px 6px), linear-gradient(115deg, transparent 40%, #ff2e4d55 50%, transparent 60%); opacity: .45; mix-blend-mode: screen; animation: holo 2.2s steps(6) infinite; }
@keyframes ztwinkle { 50% { opacity: .2; } }
@keyframes zhue { to { filter: hue-rotate(360deg); } }
.cz-part { position: absolute; inset: 0; z-index: 2; pointer-events: none; border-radius: inherit; background-repeat: repeat; opacity: .8; }
.cz-part-etincelles, .cz-part-braises { background-image: radial-gradient(circle, var(--zp) 0 1.2px, transparent 1.8px), radial-gradient(circle, var(--zp) 0 1px, transparent 1.6px); background-size: 22% 18%, 31% 27%; background-position: 0 0, 40% 60%; animation: zrise 4s linear infinite; }
.cz-part-braises { opacity: .7; animation-duration: 6s; }
.cz-part-flocons, .cz-part-petales { background-image: radial-gradient(circle, var(--zp) 0 1.6px, transparent 2.2px), radial-gradient(ellipse 3px 2px, var(--zp) 0 1.2px, transparent 2px); background-size: 26% 22%, 34% 30%; background-position: 10% 0, 60% 30%; animation: zfall 7s linear infinite; }
.cz-part-lucioles { background-image: radial-gradient(circle, var(--zp) 0 1.6px, color-mix(in srgb, var(--zp) 40%, transparent) 2.6px, transparent 4px); background-size: 38% 30%; animation: zrise 9s linear infinite, ztwinkle 1.6s ease-in-out infinite; }
.cz-part-runes { background-image: radial-gradient(circle, var(--zp) 0 1.4px, transparent 2px); background-size: 18% 14%; mask-image: radial-gradient(closest-side, transparent 60%, #000 75%); animation: zrise 5s linear infinite; }
@keyframes zrise { from { background-position: 0 100%, 40% 160%; } to { background-position: 0 -100%, 40% -40%; } }
@keyframes zfall { from { background-position: 10% -100%, 60% -70%; } to { background-position: 30% 100%, 40% 130%; } }
.kcw.cz-pres-flotte { animation: zfloat 3.6s ease-in-out infinite; }
.kcw.cz-pres-incline .kc { animation: ztilt 6s ease-in-out infinite; }
@keyframes ztilt { 25% { transform: perspective(600px) rotateY(9deg) rotateX(3deg); } 75% { transform: perspective(600px) rotateY(-9deg) rotateX(-2deg); } }
.kcw.cz-pres-projecteur::after { content: ""; position: absolute; inset: -30% -20% 30%; z-index: -1; background: radial-gradient(ellipse at 50% 0, #fff3, transparent 65%); pointer-events: none; }
.kcw.cz-pres-orbite .kc { animation: zorbit 9s ease-in-out infinite; }
@keyframes zorbit { 50% { transform: perspective(700px) rotateY(18deg) translateY(-1.5cqw); } }
@media (prefers-reduced-motion: reduce) { .kc.cz-cadre-prisme, .kcw.cz-aura::before, .cz-orn, .cz-orn-ailes::before, .cz-orn-ailes::after, .cz-holo, .cz-part, .kcw.cz-pres-flotte, .kcw.cz-pres-incline .kc, .kcw.cz-pres-orbite .kc { animation: none !important; } }

/* ===== Boutique, Atelier, Sanctuaire ===== */
.z-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; padding: 12px 16px; margin: 0 0 18px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-lg); font-size: 14px; color: var(--fg2); }
.z-bar b { color: var(--fg); font-family: var(--mono); }
.z-bar .btn { margin-left: auto; }
.zgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; margin-top: 18px; }
@media (min-width: 700px) { .zgrid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (min-width: 1100px) { .zgrid { grid-template-columns: repeat(5, minmax(0, 1fr)); } }
.zt { display: flex; flex-direction: column; gap: 10px; padding: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-lg); height: 100%; box-sizing: border-box; }
.zt-prev { padding: 6px 10%; }
.zt-t { display: flex; flex-direction: column; gap: 2px; font-size: 14px; line-height: 1.3; flex: 1; }
.zt-t span { font: 500 12px var(--mono); }
.zt-t small { color: var(--mut); font-size: 12px; }
.zt .btn { width: 100%; }
.zat { display: grid; gap: 24px; margin-top: 18px; }
@media (min-width: 900px) { .zat { grid-template-columns: 320px minmax(0, 1fr); align-items: start; } .zat-prev { position: sticky; top: 92px; } }
.zat-prev { display: flex; flex-direction: column; gap: 14px; }
.zat-card { width: min(260px, 70vw); margin: 0 auto; padding: 18px 0; }
.zpick { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--mut); }
.zpick select { height: 44px; padding: 0 12px; border-radius: var(--r-md); background: var(--panel); border: 1px solid var(--line2); color: var(--fg); font: 500 14px var(--body); }
.zat-slots { display: flex; flex-direction: column; gap: 18px; }
.zslot { display: flex; flex-direction: column; gap: 8px; }
.zopts { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.zopt { --c: var(--line3); display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 4px 12px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line2); color: var(--fg3); font: 500 13px var(--body); cursor: pointer; text-align: left; }
.zopt i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); flex: none; }
.zopt small { color: var(--mut); font-size: 11px; }
.zopt:hover { border-color: var(--line3); color: var(--fg); }
.zopt.on { border-color: var(--c); color: var(--fg); background: color-mix(in srgb, var(--c) 14%, var(--panel)); }
.zopt:not([data-ref]).on, .zopt[data-ref=""].on { --c: var(--acc); }
.zopt-line { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--fg2); cursor: pointer; }
.zopt-line input { width: 18px; height: 18px; accent-color: var(--acc); }
.zs-side { display: flex; flex-direction: column; gap: 12px; }
/* Sanctuaire : trois offres (×1 une carte, ×5 une pochette, ×10 le coffre) */
.zoffers { display: grid; gap: 14px; grid-template-columns: repeat(3, minmax(0, 1fr)); margin: 18px 0 22px; }
@media (max-width: 640px) { .zoffers { grid-template-columns: 1fr; } }
.zoffer { position: relative; display: grid; justify-items: center; gap: 4px; padding: 18px 14px 16px; border-radius: var(--r-xl); border: 1px solid var(--line2); background: radial-gradient(120% 80% at 50% 0%, #b072ff22, transparent 70%), var(--bg2); color: var(--fg); cursor: pointer; transition: transform .15s, border-color .15s; }
.zoffer:hover:not(:disabled) { transform: translateY(-3px); border-color: #b072ff; }
.zoffer:disabled { opacity: .5; cursor: default; }
.zoffer.n10 { border-color: #f5c51866; background: radial-gradient(120% 80% at 50% 0%, #f5c51826, transparent 70%), var(--bg2); }
.zo-art { height: 110px; display: grid; place-items: center; }
.zo-card, .zo-pouch, .zo-chest { display: grid; place-items: center; font: 700 30px/1 "Zen Kaku Gothic New", sans-serif; color: #fff; }
.zo-card { width: 64px; height: 92px; border-radius: 8px; border: 2px solid #b072ff; background: repeating-linear-gradient(135deg, #1a1622 0 8px, #221b2e 8px 16px); box-shadow: 0 0 18px #b072ff55; }
.zo-pouch { width: 78px; height: 104px; border-radius: 10px 10px 14px 14px; background: linear-gradient(160deg, #6a3cc8, #2a1450); border: 2px solid #c8a4ff; box-shadow: 0 0 22px #b072ff66; clip-path: polygon(0 6%, 12% 0, 24% 6%, 36% 0, 48% 6%, 60% 0, 72% 6%, 84% 0, 100% 6%, 100% 100%, 0 100%); }
.zo-chest { position: relative; width: 112px; height: 84px; margin-top: 18px; border-radius: 10px; background: linear-gradient(180deg, #4a2a10, #24140a); border: 3px solid #e2b54a; box-shadow: 0 0 26px #f5c51855; color: #ffe9a0; }
.zo-chest i { position: absolute; left: -3px; right: -3px; top: -24px; height: 26px; border-radius: 12px 12px 4px 4px; background: linear-gradient(180deg, #6a3c18, #3a2210); border: 3px solid #e2b54a; }
.zo-n { font: 700 13px var(--mono); color: var(--mut); }
.zo-t { font: 700 20px var(--disp); }
.zo-s { font-size: 13px; color: var(--fg2); }
.zo-p { margin-top: 8px; padding: 6px 16px; border-radius: 999px; background: var(--gold); color: #1a1406; font: 700 14px var(--mono); }
.zo-p s { opacity: .55; font-weight: 500; margin-left: 4px; }
.zoffer.n1 .zo-p { background: #b072ff; color: #fff; }
/* objet cosmétique dans l'ouverture (carte d'exemple portant l'objet + nom) */
.ocos { position: relative; display: grid; gap: 6px; }
.ocos-t { display: grid; gap: 1px; text-align: center; line-height: 1.2; }
.ocos-t b { font-size: 13px; }
.ocos-t i { font: 500 11px var(--mono); font-style: normal; }
.ocos-new { position: absolute; top: -9px; left: 50%; transform: translateX(-50%); white-space: nowrap; z-index: 3; padding: 2px 7px; border-radius: 999px; background: var(--acc); color: #1a0c0a; font: 700 10px var(--mono); }
.stage .reveal-card .ocos-t, .cf .slot .ocos-t { display: none; }
.cf .multi.ten { grid-template-columns: repeat(5, minmax(0, 128px)); }
@media (max-width: 700px) { .cf .multi.ten { grid-template-columns: repeat(4, minmax(0, 84px)); gap: 8px; } }
.summary.ten { grid-template-columns: repeat(4, minmax(0, 88px)); }
@media (min-width: 700px) { .summary.ten { grid-template-columns: repeat(5, minmax(0, 140px)); } }
.zrates { display: flex; flex-wrap: wrap; gap: 6px 14px; font: 500 12px var(--mono); color: var(--fg2); }
.zrates i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
.zfeat-row { display: grid; grid-template-columns: minmax(0, 200px) minmax(0, 1fr); gap: 20px; align-items: center; }
.zfeat-row h2 { margin: 0 0 6px; }
@media (max-width: 560px) { .zfeat-row { grid-template-columns: 1fr; justify-items: center; text-align: center; } .zfeat-row > .kcw { --w: 200px; } }

/* ===== Coffre arcanique : coffre 3D, clé, runes, cristal, temps forts des scénarios ===== */
@property --rare { syntax: "<color>"; inherits: true; initial-value: #b5b1bb; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.stage-wrap { transition: --glow .6s; }
.cf { position: relative; overflow: hidden; transition: --rare .55s ease; min-height: 520px; }
.cf-fx { position: absolute; inset: 0; pointer-events: none; z-index: 4; }
.cf .c3-scene { position: relative; perspective: 900px; margin: 40px 0 10px; animation: cfdrop .7s cubic-bezier(.2, .9, .3, 1.25) both; --w: 200px; --d: 172px; --hb: 120px; --hl: 66px; }
@media (max-width: 560px) { .cf .c3-scene { --w: 150px; --d: 130px; --hb: 90px; --hl: 50px; } }
@keyframes cfdrop { from { opacity: 0; transform: translateY(-90px) scale(.7); } to { opacity: 1; transform: none; } }
.cf .c3-scene.redrop { animation: cfdrop .7s cubic-bezier(.2, .9, .3, 1.25) both; }
.cf .c3 { position: relative; width: var(--w); height: calc(var(--hb) + var(--hl)); transform-style: preserve-3d; transform: rotateX(-16deg) rotateY(-30deg); animation: cfsway 5s ease-in-out infinite; }
@keyframes cfsway { 50% { transform: rotateX(-12deg) rotateY(-18deg) translateY(-6px); } }
.cf .c3.shake1 { animation: cfrattle .2s linear 2; }
.cf .c3.shake2 { animation: cfrattle .14s linear 4; }
.cf .c3.shake3 { animation: cfrattle .09s linear 9; }
@keyframes cfrattle { 25% { transform: rotateX(-16deg) rotateY(-26deg) rotateZ(2.5deg); } 75% { transform: rotateX(-16deg) rotateY(-34deg) rotateZ(-2.5deg); } }
.cf .c3-base, .cf .c3-lid { position: absolute; left: 0; width: var(--w); transform-style: preserve-3d; }
.cf .c3-base { top: var(--hl); height: var(--hb); }
.cf .c3-lid { top: 0; height: var(--hl); transform-origin: 50% 100% calc(var(--d) / -2); transition: transform .9s cubic-bezier(.3, 1.35, .5, 1); }
.cf .c3.peek .c3-lid { transform: rotateX(28deg); transition-duration: .5s; }
.cf .c3.open .c3-lid { transform: rotateX(105deg); }
.cf .f { position: absolute; border-radius: 4px;
  background: radial-gradient(70% 55% at 28% 30%, color-mix(in srgb, var(--rare) 38%, transparent), transparent 70%),
    repeating-linear-gradient(128deg, transparent 0 17px, color-mix(in srgb, var(--rare) 22%, transparent) 17px 19px, transparent 19px 34px),
    linear-gradient(160deg, #1d2735, #0d121b 70%);
  box-shadow: inset 0 0 0 3px #0a0d13, inset 0 0 0 6px #c9a24a, inset 0 0 0 8px #6e5524, inset 0 0 26px color-mix(in srgb, var(--rare) 55%, transparent); }
.cf .f::before { content: ""; position: absolute; inset: 9px; border-radius: 2px; border: 1px solid color-mix(in srgb, var(--rare) 50%, transparent); box-shadow: 0 0 8px color-mix(in srgb, var(--rare) 40%, transparent); }
.cf .c3.gilded .f { background: radial-gradient(70% 55% at 28% 30%, #fff5c855, transparent 70%), linear-gradient(160deg, #d9b452, #7a5718 70%); }
.cf .c3.sheen .c3-base .front::after { content: ""; position: absolute; inset: 0; background: linear-gradient(105deg, transparent 30%, #fff8 48%, #f0c860aa 52%, transparent 70%); background-size: 260% 100%; animation: cfsheen .85s ease-out both; }
@keyframes cfsheen { from { background-position: 120% 0; } to { background-position: -40% 0; } }
.cf .c3.chrysalis { filter: brightness(1.8) saturate(.4) drop-shadow(0 0 30px #fff); animation: cfcocoon 1.25s ease-in-out; }
@keyframes cfcocoon { 30% { transform: rotateX(-16deg) rotateY(-30deg) scale(.86); } 70% { transform: rotateX(-16deg) rotateY(-30deg) scale(1.12); } }
.cf .c3.ghost { position: absolute; left: 0; top: 0; opacity: .45; filter: blur(1px); animation: cftwin 1.1s ease-in-out forwards; pointer-events: none; }
@keyframes cftwin { 0% { translate: 0 0; } 40% { translate: 70% -10px; } 100% { translate: 0 0; opacity: 0; } }
.cf .c3-base .front, .cf .c3-base .back { width: var(--w); height: var(--hb); }
.cf .c3-base .front { transform: translateZ(calc(var(--d) / 2)); }
.cf .c3-base .back { transform: rotateY(180deg) translateZ(calc(var(--d) / 2)); }
.cf .c3-base .right, .cf .c3-base .left { width: var(--d); height: var(--hb); left: calc((var(--w) - var(--d)) / 2); filter: brightness(.62); }
.cf .c3-base .right { transform: rotateY(90deg) translateZ(calc(var(--w) / 2)); }
.cf .c3-base .left { transform: rotateY(-90deg) translateZ(calc(var(--w) / 2)); }
.cf .c3-base .bottom, .cf .c3-base .inside { width: var(--w); height: var(--d); top: calc((var(--hb) - var(--d)) / 2); }
.cf .c3-base .bottom { transform: rotateX(-90deg) translateZ(calc(var(--hb) / 2)); filter: brightness(.4); }
.cf .c3-base .inside { transform: rotateX(90deg) translateZ(calc(var(--hb) / 2 - 3px)); background: radial-gradient(circle, color-mix(in srgb, var(--rare) 70%, white), color-mix(in srgb, var(--rare) 40%, #000) 70%); box-shadow: none; }
.cf .c3-base .inside::before { display: none; }
.cf .c3-lid .front, .cf .c3-lid .back { width: var(--w); height: var(--hl); }
.cf .c3-lid .front { transform: translateZ(calc(var(--d) / 2)); }
.cf .c3-lid .back { transform: rotateY(180deg) translateZ(calc(var(--d) / 2)); }
.cf .c3-lid .right, .cf .c3-lid .left { width: var(--d); height: var(--hl); left: calc((var(--w) - var(--d)) / 2); filter: brightness(.62); }
.cf .c3-lid .right { transform: rotateY(90deg) translateZ(calc(var(--w) / 2)); }
.cf .c3-lid .left { transform: rotateY(-90deg) translateZ(calc(var(--w) / 2)); }
.cf .c3-lid .top, .cf .c3-lid .under { width: var(--w); height: var(--d); top: calc((var(--hl) - var(--d)) / 2); }
.cf .c3-lid .top { transform: rotateX(90deg) translateZ(calc(var(--hl) / 2)); filter: brightness(1.18); }
.cf .c3-lid .under { transform: rotateX(-90deg) translateZ(calc(var(--hl) / 2)); background: radial-gradient(circle, color-mix(in srgb, var(--rare) 55%, white), color-mix(in srgb, var(--rare) 30%, #000) 75%); }
.cf .emblem { position: absolute; left: 50%; top: -34%; width: 64%; transform: translateX(-50%) translateZ(calc(var(--d) / 2 + 2px)); filter: drop-shadow(0 0 6px var(--rare)); pointer-events: none; }
.cf .emblem svg { display: block; width: 100%; }
.cf .c3.open .emblem { opacity: 0; transition: opacity .2s; }
.cf .lock { position: absolute; left: 50%; top: 52%; width: 34px; height: 34px; margin-left: -17px; border-radius: 50%; transform: translateZ(4px); }
.cf .lock.hot { box-shadow: 0 0 0 3px var(--rare), 0 0 18px var(--rare); }
.cf .beam { position: absolute; left: 18%; right: 18%; bottom: 52%; height: 0; opacity: 0; pointer-events: none; background: linear-gradient(to top, color-mix(in srgb, var(--rare) 65%, white), transparent); filter: blur(8px); transition: height .7s ease .25s, opacity .7s ease .25s; }
.cf .c3-scene.open .beam { height: 260%; opacity: .9; }
/* runes en orbite et cristal au-dessus du coffre */
.cf-runes { position: absolute; left: 50%; top: 50%; width: 0; height: 0; pointer-events: none; }
.cf-runes i { position: absolute; font: 700 18px/1 var(--body); font-style: normal; color: color-mix(in srgb, var(--rare) 35%, #444); transform: rotate(calc(var(--i) * 45deg)) translateY(calc(var(--w) * -.95)) rotate(calc(var(--i) * -45deg)); translate: -50% -50%; transition: color .25s, text-shadow .25s; }
.cf-runes i.on { color: color-mix(in srgb, var(--rare) 60%, white); text-shadow: 0 0 12px var(--rare), 0 0 2px #fff; }
.cf.dim .cf-runes i, .cf.dim .c3 { filter: brightness(.35); transition: filter .35s; }
.cf-crystal { position: absolute; left: 50%; top: -46px; width: 26px; height: 40px; translate: -50% 0; pointer-events: none; z-index: 2; }
.cf-crystal i { position: absolute; inset: 0; clip-path: polygon(50% 0, 100% 40%, 50% 100%, 0 40%); background: linear-gradient(160deg, #fff, var(--rare) 55%, #10101a); box-shadow: 0 0 18px var(--rare); filter: drop-shadow(0 0 8px var(--rare)); animation: cffloat 2.6s ease-in-out infinite; }
.cf-crystal i + i { display: none; }
@keyframes cffloat { 50% { translate: 0 -6px; } }
.cf-crystal.pulse i:first-child { animation: cfpulse .45s ease-out; }
@keyframes cfpulse { 50% { transform: scale(1.4); filter: brightness(2) drop-shadow(0 0 16px var(--rare)); } }
.cf-crystal.cracked i:first-child { background: linear-gradient(160deg, #888, #333 55%, #10101a); }
.cf-crystal.cracked::after { content: ""; position: absolute; inset: 0; clip-path: polygon(50% 0, 100% 40%, 50% 100%, 0 40%); background: linear-gradient(120deg, transparent 45%, var(--rare) 47%, transparent 50%), linear-gradient(60deg, transparent 55%, var(--rare) 57%, transparent 60%); }
.cf-crystal.burst i:first-child { animation: cfburst .45s ease-out forwards; }
@keyframes cfburst { to { transform: scale(2.6); opacity: 0; filter: brightness(3); } }
.cf-crystal.split i { display: block; animation: cfsplit .95s ease-out forwards; }
.cf-crystal.split i:nth-child(2) { --x: -60px; } .cf-crystal.split i:nth-child(3) { --x: 60px; }
@keyframes cfsplit { to { translate: var(--x, 0) 8px; } }
/* clé */
.cf .keybox { display: grid; justify-items: center; gap: 6px; margin-top: 42px; z-index: 3; }
.cf .key { width: 132px; height: 40px; display: grid; place-items: center; cursor: grab; touch-action: none; user-select: none; filter: drop-shadow(0 4px 10px #000c) drop-shadow(0 0 6px color-mix(in srgb, var(--rare) 60%, transparent)); transition: transform .35s cubic-bezier(.4, 0, .2, 1), opacity .25s; position: relative; z-index: 5; }
.cf .key svg { width: 132px; height: 40px; }
.cf .key:focus-visible { outline: 2px solid var(--cyan); outline-offset: 4px; border-radius: 8px; }
.cf .key.drag { cursor: grabbing; transition: none; }
.cf .key.broken svg { animation: cfbreak .6s ease-in forwards; }
@keyframes cfbreak { 30% { transform: rotate(-12deg); } 100% { transform: translateY(60px) rotate(40deg); opacity: 0; } }
.cf .key.golden { filter: drop-shadow(0 0 14px #f5c518) drop-shadow(0 0 4px #fff); animation: cfgold .5s ease-out; }
@keyframes cfgold { from { opacity: 0; transform: scale(1.6); } }
.cf .keyhint { font: 500 11px/1.3 var(--mono); color: var(--fg2); }
.cf-tools { display: flex; gap: 8px; justify-content: center; z-index: 5; }
.cf .sub { color: var(--mut); font-size: 13px; margin: 0; }
/* temps forts : effets plein écran */
.cf.blackout .c3-scene, .cf.blackout .keybox { opacity: 0; transition: opacity .35s; }
.cf.blackout::before { content: ""; position: absolute; inset: 0; background: #000; z-index: 3; animation: cffade .35s both; }
@keyframes cffade { from { opacity: 0; } }
.cf.night::before { content: ""; position: absolute; inset: 0; background: radial-gradient(circle at 50% 30%, #0d1030, #000 80%); z-index: 0; animation: cffade .6s both; }
.cf.night > * { position: relative; z-index: 1; }
.cf.night > .cf-fx { position: absolute; z-index: 4; }
.cf.quake { animation: cfquake .1s linear 7; }
@keyframes cfquake { 25% { translate: -6px 3px; } 75% { translate: 6px -3px; } }
.cf.glowing::after { content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 4; background: radial-gradient(55% 50% at 50% 45%, color-mix(in srgb, var(--rare) 70%, #fff), transparent 75%); animation: cfflash 1s ease-out forwards; }
@keyframes cfflash { 0% { opacity: 0; } 25% { opacity: .55; } 100% { opacity: 0; } }
.cf-fx .dust { position: absolute; left: 50%; top: 52%; width: 5px; height: 5px; border-radius: 50%; background: var(--rare); box-shadow: 0 0 8px var(--rare); animation: cfdust .95s ease-in var(--d) both; transform: rotate(var(--a)) translateY(-180px); }
@keyframes cfdust { to { transform: rotate(calc(var(--a) + 160deg)) translateY(0); opacity: 0; } }
.cf-fx .crown { position: absolute; left: 50%; top: 30%; width: 56px; translate: -50% 0; animation: cfcrown 1.15s ease-in-out both; filter: drop-shadow(0 0 10px #f5c518); }
@keyframes cfcrown { 0% { transform: translateX(calc(var(--s) * 140px)) scale(.6); opacity: 0; } 40% { opacity: 1; } 100% { transform: translateX(0) translateY(40px) scale(1.1); opacity: 0; } }
.cf-fx .eclipse { position: absolute; left: 50%; top: 36%; width: 150px; height: 150px; margin: -75px 0 0 -75px; border-radius: 50%; background: conic-gradient(var(--r-l) 0 50%, var(--r-m) 50% 100%); box-shadow: 0 0 60px #f5c51888, 0 0 90px #ff4d2e88; animation: cfeclipse 1.3s ease-in-out both; }
.cf-fx .eclipse::after { content: ""; position: absolute; inset: 14px; border-radius: 50%; background: #050409; animation: cfmoon 1.3s ease-in-out both; }
@keyframes cfeclipse { from { opacity: 0; transform: rotate(-90deg) scale(.4); } 30% { opacity: 1; } to { opacity: 0; transform: rotate(270deg) scale(1.3); } }
@keyframes cfmoon { from { translate: -40px 0; } to { translate: 0 0; } }
.cf-fx .coin { position: absolute; top: -20px; width: 14px; height: 14px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #fff4c0, #e2b54a 50%, #8a6420); box-shadow: 0 0 8px #f5c51888; animation: cfcoin 1.1s ease-in var(--d) both; }
@keyframes cfcoin { to { transform: translateY(560px) rotateY(720deg); opacity: .2; } }
.cf-fx .column { position: absolute; left: 50%; top: 0; bottom: 30%; width: 120px; margin-left: -60px; background: linear-gradient(to bottom, transparent, color-mix(in srgb, var(--rare) 75%, white) 60%, #fff); filter: blur(10px); animation: cfcolumn 1.1s ease-out both; }
@keyframes cfcolumn { from { transform: scaleY(0); transform-origin: top; opacity: 0; } 50% { opacity: 1; } to { transform: scaleY(1); opacity: .6; } }
.cf-fx .star { position: absolute; width: 3px; height: 3px; border-radius: 50%; background: #fff; box-shadow: 0 0 6px #fff; animation: cfstar .8s ease-out var(--d) both; }
@keyframes cfstar { from { opacity: 0; transform: scale(0); } }
.cf-fx .kanji { position: absolute; left: 0; right: 0; top: 18%; text-align: center; font: 700 clamp(120px, 30vw, 220px)/1 var(--body); color: color-mix(in srgb, var(--rare) 60%, white); text-shadow: 0 0 40px var(--rare); animation: cfkanji 1.15s ease-out both; }
@keyframes cfkanji { from { opacity: 0; transform: scale(2.4); } 40% { opacity: 1; transform: scale(1); } to { opacity: 0; transform: scale(.8); } }
.cf-fx .orb { position: absolute; left: 50%; top: 42%; width: 44px; height: 64px; margin: -32px 0 0 -22px; border-radius: 6px; border: 2px solid #c9a95c; background: radial-gradient(circle at 50% 42%, #2c2240, #110e18 70%); box-shadow: 0 0 12px var(--rare); animation: cforbit 1.35s ease-in-out both; animation-delay: calc(var(--i) * -0.27s); }
@keyframes cforbit { from { transform: rotate(0) translateX(150px) rotate(0); opacity: 0; } 20% { opacity: 1; } to { transform: rotate(360deg) translateX(20px) rotate(-360deg); opacity: 0; } }
.cf-fx .aurora { position: absolute; left: -10%; right: -10%; top: calc(8% + var(--i) * 9%); height: 70px; background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--rare) 70%, #3fbf7f), color-mix(in srgb, var(--rare) 60%, #4dd6ff), transparent); filter: blur(18px); opacity: .55; animation: cfaurora 2.6s ease-in-out infinite alternate; animation-delay: calc(var(--i) * -.7s); }

/* 5 cartes face cachée */

.cf .slot { position: relative; aspect-ratio: 210 / 318; border: 0; padding: 0; background: none; cursor: pointer; animation: cfdeal .5s cubic-bezier(.2, .9, .3, 1.2) both; animation-delay: calc(var(--i) * 90ms); color: inherit; }

.stage-wrap.flashy::after { content: ""; position: fixed; inset: 0; pointer-events: none; background: radial-gradient(circle, color-mix(in srgb, var(--glow) 55%, transparent), transparent 70%); animation: cfflash 1s ease-out forwards; }

/* ===== Boutique Arcanique façon boutique Discord : bannière, collections, tuiles, aperçu ===== */
.zs-hero { position: relative; overflow: hidden; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; align-items: center; padding: 28px; margin: 6px 0 22px; border-radius: var(--r-xl); border: 1px solid var(--line2);
  background: radial-gradient(120% 140% at 0% 0%, color-mix(in srgb, var(--h1) 34%, transparent), transparent 60%), radial-gradient(90% 120% at 100% 100%, color-mix(in srgb, var(--h2) 70%, transparent), transparent 70%), var(--panel); }

.zs-hero-cards { position: relative; z-index: 1; display: flex; justify-content: center; align-items: flex-end; min-height: 230px; }

.zs-hero-card:nth-child(3) { transform: rotate(9deg) translateY(10px); }

@media (max-width: 700px) { .zs-hero { grid-template-columns: 1fr; padding: 20px; } .zs-hero-cards { min-height: 190px; } .zs-hero-card { width: 100px; } .zs-hero-card:nth-child(2) { width: 118px; } .zs-hero-k { font-size: 170px; } }
.zs-row { margin-top: 26px; }
.zs-row-h { display: flex; gap: 14px; align-items: center; }
.zs-row-h h2 { margin: 0; }
.zs-k { flex: none; width: 46px; height: 46px; display: grid; place-items: center; border-radius: 12px; font: 700 24px/1 var(--body); color: var(--h1); background: color-mix(in srgb, var(--h1) 14%, var(--panel)); border: 1px solid color-mix(in srgb, var(--h1) 40%, var(--line)); }
.zs-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (min-width: 700px) { .zs-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
@media (min-width: 1100px) { .zs-grid { grid-template-columns: repeat(5, minmax(0, 1fr)); } }
.zs-tile { display: flex; flex-direction: column; padding: 0; overflow: hidden; border-radius: 16px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); cursor: pointer; text-align: left; font: inherit; transition: transform .18s, border-color .18s, box-shadow .18s; }
.zs-tile:hover, .zs-tile:focus-visible { transform: translateY(-3px); border-color: color-mix(in srgb, var(--rc) 60%, var(--line)); box-shadow: 0 10px 26px #0007, 0 0 0 1px color-mix(in srgb, var(--rc) 35%, transparent); outline: none; }

.zs-meta { display: flex; flex-direction: column; gap: 3px; padding: 10px 12px 12px; }

.zs-price.own { background: color-mix(in srgb, var(--ok) 12%, transparent); color: var(--ok); border-color: color-mix(in srgb, var(--ok) 35%, transparent); }

/* le coffre éclate après l'ouverture */
.cf .c3-scene.gone { animation: cfgone .6s ease-in forwards; }
@keyframes cfgone { 0% { transform: scale(1); opacity: 1; } 25% { transform: scale(1.12); opacity: 1; } 100% { transform: scale(1.45); opacity: 0; } }
.cf-fx .boom { position: absolute; width: 40px; height: 40px; margin: -20px 0 0 -20px; border-radius: 50%; background: radial-gradient(circle, #fff, color-mix(in srgb, var(--rare) 70%, #fff) 40%, transparent 70%); animation: cfboom .6s ease-out forwards; }
@keyframes cfboom { from { transform: scale(.4); opacity: 1; } to { transform: scale(9); opacity: 0; } }
.cf .c3-scene.gone .beam, .cf .c3-scene.gone .cf-runes, .cf .c3-scene.gone .cf-crystal { opacity: 0; transition: opacity .3s; }
.cf-fx .shard { position: absolute; width: 34px; height: 26px; margin: -13px 0 0 -17px; clip-path: polygon(0 20%, 60% 0, 100% 55%, 40% 100%); background: linear-gradient(160deg, #c9a24a, var(--rare) 55%, #1d2735); box-shadow: 0 0 10px var(--rare); animation: cfshard .65s cubic-bezier(.2,.7,.3,1) forwards; }
@keyframes cfshard { to { transform: translate(var(--dx), var(--dy)) rotate(var(--r)) scale(var(--s)); opacity: 0; } }
.cf .key, .cf .c3 { cursor: pointer; }

.cff { --fc: #8a8590; position: relative; display: flex; flex-direction: column; align-items: center; gap: 4px; width: 100%; aspect-ratio: 5 / 7; padding: 0 8px 8px; box-sizing: border-box; border-radius: 12px; overflow: hidden; text-align: center;
  background: radial-gradient(90% 55% at 50% 38%, color-mix(in srgb, var(--fc) 32%, transparent), transparent 70%), linear-gradient(170deg, #1d1b26, #0e0d12);
  border: 2px solid color-mix(in srgb, var(--fc) 70%, #000); box-shadow: inset 0 0 0 1px #ffffff14, inset 0 0 0 4px #0e0d12, inset 0 0 0 5px color-mix(in srgb, var(--fc) 45%, transparent); }
.cff-band { align-self: stretch; display: flex; justify-content: space-between; align-items: center; margin: 0 -8px; padding: 5px 9px; font: 700 10px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: #0e0d12; background: var(--fc); }

.cff-art { flex: 1; min-height: 0; width: 70%; display: grid; place-items: center; color: color-mix(in srgb, var(--fc) 80%, #fff); filter: drop-shadow(0 0 10px color-mix(in srgb, var(--fc) 60%, transparent)); }
.cff-art svg { width: 100%; max-height: 100%; }
.cff-name { font: 700 13px/1.15 var(--body); color: var(--fg); text-wrap: balance; }
.cff-rule { font-size: 11px; line-height: 1.3; color: var(--fg2); text-wrap: balance; }
.cff-when { font: 600 9px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: color-mix(in srgb, var(--fc) 75%, #fff); opacity: .85; }
.cfc { --fc: #8a8590; display: inline-flex; align-items: center; gap: 5px; padding: 3px 8px 3px 4px; border-radius: 999px; font-size: 11px; color: var(--fg); background: color-mix(in srgb, var(--fc) 16%, var(--bg2)); border: 1px solid color-mix(in srgb, var(--fc) 50%, transparent); vertical-align: middle; }
.cfc svg { width: 18px; height: 18px; color: var(--fc); flex: none; }
.cfc.base { --fc: #8a8590; opacity: .8; }
.cf-hand { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
@media (max-width: 560px) { .cf-hand { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; } .cff-rule { font-size: 10px; } .cff-name { font-size: 12px; } }
.cf-card { padding: 0; border: 0; background: none; border-radius: 12px; cursor: pointer; transition: transform .15s, box-shadow .15s, opacity .15s; }
.cf-card:disabled { opacity: .42; cursor: default; filter: saturate(.5); }
.cf-card.ok { box-shadow: 0 0 0 2px #f5c51899, 0 0 18px #f5c51840; }

.cf-card.picked { box-shadow: 0 0 0 3px var(--acc), 0 0 20px #ff4d2e88; opacity: .8; }
.cf-card:focus-visible { outline: 3px solid var(--cyan); outline-offset: 2px; }
.cf-banner { position: sticky; top: calc(76px + env(safe-area-inset-top, 0px)); z-index: 5; display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: center; padding: 12px 16px; margin-bottom: 14px; border-radius: var(--r-lg); background: linear-gradient(90deg, #f5c51833, #15141a 70%); border: 1px solid #f5c51888; box-shadow: 0 8px 22px #0008; }
.cf-banner b { color: var(--gold); font-size: 16px; }
.cf-banner span { color: var(--fg2); font-size: 13px; }
.cf-banner.off { background: var(--panel); border-color: var(--line2); color: var(--fg2); }
.cf-react { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px; border-radius: var(--r-lg); background: #ff4d2e14; border: 1px solid #ff4d2e55; }
.cf-react .btn { flex: 1 1 160px; min-height: 48px; }
.cf-seat { position: relative; }
.cf-seat.target { box-shadow: 0 0 0 2px var(--gold), 0 0 24px #f5c51866; animation: cfTarget 1.2s ease-in-out infinite; }
@keyframes cfTarget { 50% { box-shadow: 0 0 0 2px var(--gold), 0 0 6px #f5c51833; } }
.cf-ribbon { position: absolute; top: -9px; left: 12px; padding: 3px 9px; border-radius: 999px; font: 700 10px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; background: var(--gold); color: #1a1405; }
.cf-seat-top { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 10px; align-items: center; }
.cf-seat-top .cf-perso .kcw, .cf-seat-top .cf-perso .cf-loan { width: 64px; }

.cf-role { align-self: flex-start; padding: 2px 8px; border-radius: 999px; font: 700 10px/1.4 var(--mono); letter-spacing: .06em; text-transform: uppercase; border: 1px solid currentColor; }
.cf-role.r-gardien { color: var(--gold); } .cf-role.r-sentinelle { color: var(--cyan); } .cf-role.r-briseur { color: var(--acc); } .cf-role.r-errant { color: #b072ff; }
.cf-hp { position: relative; display: flex; height: 16px; border-radius: 4px; overflow: hidden; background: #2a0d0d; border: 1px solid #000; }

.cf-tgt { display: flex; flex-direction: column; gap: 6px; }

.cf-emb { display: inline-block; width: 44px; height: 44px; flex: none; background-size: contain; background-repeat: no-repeat; background-position: center; filter: drop-shadow(0 2px 4px #0008); vertical-align: middle; }

/* ===================== Thème « Arcane Néon » (choisi par Reichi le 22/10/2026) =====================
   Arcane : or, cadres taillés, titres classiques (Cinzel). Néon : grande image, lueurs rose et cyan,
   barre du bas arrondie. Les couleurs ont un rôle : or = prestige et action principale,
   cyan = utile tout de suite (essence, missions, cible), rose = l'événement (pack du jour, Mythique). */
:root {
  --bg: #080712; --bg2: #0c0a18; --panel: #100c1e; --panel2: #130e24; --raise: #1b1530;
  --line: #e8c77e1c; --line2: #e8c77e33; --line3: #e8c77e5c;
  --fg: #f0e6d2; --fg2: #c9bfd6; --fg3: #ddd3e4; --mut: #a99cc8; --dim: #6a6280;
  --acc: #ff2e88; --acc2: #ff5aa5; --acc-soft: #ff2e881f;
  --cyan: #2ee6ff; --gold: #e8c77e; --gold-soft: #e8c77e1f; --gold2: #f0d38c; --gold3: #b88a3e;
  --disp: "Cinzel", Georgia, serif; --body: "Inter", "Zen Kaku Gothic New", system-ui, sans-serif;
  --r-sm: 2px; --r-md: 3px; --r-lg: 4px; --r-xl: 6px;
  --bevel: polygon(12px 0, calc(100% - 12px) 0, 100% 12px, 100% calc(100% - 12px), calc(100% - 12px) 100%, 12px 100%, 0 calc(100% - 12px), 0 12px);
  --glow-acc: 0 0 18px #ff2e8866; --glow-cyan: 0 0 16px #2ee6ff44; --glow-gold: 0 0 20px #e8c77e44;
}
html { background: var(--bg); }
body { background: radial-gradient(120% 50% at 50% -8%, #1d1236 0%, #080712 62%) no-repeat, var(--bg); }
::selection { background: var(--acc); color: #fff; }
/* en-tête et logo (losange doré) */
.hd { background: rgba(8, 7, 18, .9); border-bottom-color: var(--line2); }
.logo-mk { width: 32px; height: 32px; border-radius: 0; transform: rotate(45deg); background: none; border: 1.5px solid var(--gold); box-shadow: var(--glow-acc); }
.logo-mk i { transform: rotate(-45deg); background: none; color: var(--gold); font: 800 14px/1 var(--disp); width: auto; height: auto; }
.logo b { font: 800 18px/1 var(--disp); letter-spacing: .14em; }
.nav > a[aria-current="page"]::after { background: var(--acc); box-shadow: var(--glow-acc); }
.nav .ev { color: var(--gold2); }
.wal, .mpill, .ib { border-radius: 0; border-color: var(--line2); background: #100c1ecc; }
.wal .bar i { background: var(--acc); }
.badge { background: var(--acc); color: #fff; }
/* titres */
h1 { font-weight: 800; letter-spacing: .01em; }
h1 em { color: var(--acc); text-shadow: var(--glow-acc); }
h2, h3 { font-weight: 700; letter-spacing: .01em; }
.eyebrow { color: var(--cyan); }
.eyebrow.gold { color: var(--gold); }
.hero h2.big, .ft p b { font-weight: 800; }
/* boutons : or taillé pour l'action principale, rose lumineux pour l'événement */
.btn { border-radius: 0; border-color: var(--line3); background: #0c0a18cc; font-family: var(--body); }
.btn.gold { background: linear-gradient(180deg, var(--gold2), var(--gold3)); border-color: transparent; color: #1a1206; font: 700 15px var(--body); padding: 0 30px; clip-path: polygon(12px 0, calc(100% - 12px) 0, 100% 50%, calc(100% - 12px) 100%, 12px 100%, 0 50%); }
.btn.gold:focus-visible { clip-path: none; outline: 2px solid var(--cyan); outline-offset: 2px; }
.btn.acc { background: var(--acc); border-color: var(--acc); color: #fff; font: 700 15px var(--body); box-shadow: var(--glow-acc); }
.btn.big { font-size: 16px; }
.btn.sq { border-radius: 0; }
.bigopen { border-radius: 0; background: linear-gradient(180deg, var(--gold2), var(--gold3)); color: #1a1206; clip-path: polygon(14px 0, calc(100% - 14px) 0, 100% 50%, calc(100% - 14px) 100%, 14px 100%, 0 50%); }
.bigopen.acc { background: var(--acc); color: #fff; }
.bigopen.two { background: transparent; clip-path: none; color: var(--cyan); box-shadow: inset 0 0 0 1.5px var(--cyan), var(--glow-cyan); }
.bigopen.two.acc { color: var(--acc2); box-shadow: inset 0 0 0 1.5px var(--acc), var(--glow-acc); }
.comptoir { background: var(--acc); color: #fff; box-shadow: var(--glow-acc), 0 8px 20px #0008; font-family: var(--body); }
/* panneaux : bord doré fin ; le grand bandeau de l'accueil est taillé et lumineux */
.card, .pkd, .acc-card, .m-foot { border-color: var(--line2); }
.hero { border: 0; border-radius: 0; clip-path: var(--bevel); background: radial-gradient(70% 70% at 60% 60%, #ff2e8822, transparent 70%), linear-gradient(180deg, #171030, #0c0918); box-shadow: inset 0 0 0 1.5px var(--gold); }
.hero.acc { background: radial-gradient(70% 70% at 60% 60%, #ff2e8833, transparent 70%), linear-gradient(180deg, #1a0d24, #0c0918); box-shadow: inset 0 0 0 1.5px var(--acc); }
.hero.vio { background: radial-gradient(70% 70% at 60% 60%, #2ee6ff26, transparent 70%), linear-gradient(180deg, #0f1430, #0c0918); box-shadow: inset 0 0 0 1.5px var(--cyan); }
.hero-t .eyebrow { color: var(--acc); }
.mgrid button { border-radius: 0; }
.mgrid button[aria-current="page"] { border-color: var(--acc); box-shadow: var(--glow-acc); }
.mgrid button[aria-current="page"] i { color: var(--acc); }
.m-foot a:first-child, .m-foot button:first-child { color: var(--acc); }
.toast { background: var(--gold2); color: #1a1206; }
/* barre du bas (téléphone) : arrondie, onglet actif rose */
.tabbar { display: none; }
@media (max-width: 899px) {

.stage.rv.rv-dark::before { opacity: 0; }

/* ===== Arène 3D de Confrontation (src/arena.js) ===== */
body.ar-on { overflow: hidden; }
.ar { --ag: #e8c77e; --ac: #2ee6ff; --ap: #ff2e88; --am: #a99cc8; --abad: #ff4d5e; --aok: #3fdc8f; --af: #f0e6d2; --aline: #e8c77e40; position: fixed; inset: 0; z-index: 70; background: #07060f; color: var(--af); font-family: var(--body); user-select: none; -webkit-user-select: none; overflow: hidden; overflow: clip; }
.ar[hidden] { display: none; }

#ar-c { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.ar-vign { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 50% 40%, transparent 50%, #000b 100%); }
.ar-load { position: absolute; inset: 0; display: grid; place-items: center; font: 600 14px var(--body); color: var(--am); background: #07060f; z-index: 20; }
.ar-load[hidden] { display: none; }
.ar .btn { height: 40px; padding: 0 16px; font-size: 14px; }
.ar .btn.sm { height: 34px; padding: 0 12px; font-size: 13px; }
.ar-top { position: absolute; left: 14px; top: calc(12px + env(safe-area-inset-top)); z-index: 6; display: flex; gap: 6px; flex-wrap: wrap; }

.ar-top .btn.acc { background: linear-gradient(180deg, #ff5aa5, #c4166a); color: #fff; border: 0; }
.ar-hint { position: absolute; top: calc(12px + env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); z-index: 6; font: 600 13px var(--body); background: #0b0916d9; border: 1px solid var(--aline); padding: 8px 16px; border-radius: 999px; max-width: calc(100vw - 32px); text-align: center; pointer-events: none; }
.ar-hint[hidden], .ar-chip[hidden], .ar-top [hidden], .ar [hidden] { display: none; }
/* étiquettes au-dessus des champions */
.ar-tag { position: absolute; left: 0; top: 0; transform: translate(-50%, -100%); display: flex; flex-direction: column; align-items: center; gap: 3px; cursor: pointer; transition: opacity .3s, filter .3s; white-space: nowrap; z-index: 3; }

.ar-nm .cf-emb { width: 22px; height: 22px; border-radius: 50%; flex: none; }

.ar-pv { display: flex; gap: 3px; }
.ar-pv i { width: 11px; height: 11px; transform: rotate(45deg); border-radius: 2px; background: var(--abad); box-shadow: 0 0 6px var(--abad); transition: background .3s; }

.ar-tag.target { filter: drop-shadow(0 0 10px var(--ap)); }

.ar-tag.far { opacity: .45; }

.ar-tm { display: none; width: 76px; height: 4px; border-radius: 4px; background: #ffffff22; overflow: hidden; }

/* nombres qui sautent, bulles, présages */
.ar-pop { position: absolute; left: 0; top: 0; transform: translate(-50%, -50%); font: 900 34px var(--disp); pointer-events: none; text-shadow: 0 2px 0 #000, 0 0 18px currentColor; animation: ar-pop 1.1s ease-out forwards; z-index: 6; white-space: nowrap; }

.ar-flash { position: absolute; inset: 0; pointer-events: none; z-index: 4; opacity: 0; }

.ar-bub { position: absolute; transform: translate(-50%, -100%); z-index: 7; pointer-events: none; max-width: 190px; padding: 7px 11px; border-radius: 14px 14px 14px 4px; background: #f0e6d2; color: #120d22; font: 600 12.5px/1.3 var(--body); box-shadow: 0 6px 18px #000a; animation: ar-in .25s ease-out; }

.ar-bub.emo b { display: block; color: var(--bc); line-height: 1.1; } .ar-bub.emo b .ic { width: 34px; height: 34px; filter: drop-shadow(0 0 8px var(--bc)); }

@keyframes ar-in { from { opacity: 0; transform: translate(-50%, -80%); } } @keyframes ar-emo { from { opacity: 0; transform: translate(-50%, -60%) scale(.3); } }
.ar-omen { position: absolute; transform: translate(-50%, -100%); z-index: 7; pointer-events: none; text-align: center; width: 104px; padding: 6px 4px 8px; border-radius: 10px; background: #0b0916f0; border: 2px solid var(--oc); box-shadow: 0 0 24px var(--oc); animation: ar-omen 2s ease-out both; }

/* ===== Ouvertures en 3D (src/open3d.js) ===== */

.o3-title { position: absolute; left: 0; right: 0; top: 16%; text-align: center; pointer-events: none; font: 900 clamp(30px, 8vw, 64px) var(--disp); letter-spacing: .1em; color: #fff; opacity: 0; text-shadow: 0 0 20px var(--rc, #fff), 0 0 50px var(--rc, #fff); }

.o3-bar { position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 16px calc(16px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; align-items: center; gap: 10px; pointer-events: none; }

.o3-bar [hidden] { display: none; }

.ar-pre-body.ph-choix .cf-props { display: flex; justify-content: center; gap: 18px; flex-wrap: wrap; perspective: 900px; }
.ar-pre-body.ph-choix .cf-prop { transition: transform .25s; }
.ar-pre-body.ph-choix .cf-prop:first-child:not(:only-child) { transform: rotateY(14deg); } .ar-pre-body.ph-choix .cf-prop:last-child:not(:only-child) { transform: rotateY(-14deg); }
.ar-pre-body.ph-choix .cf-prop:hover { transform: translateY(-6px) scale(1.03); }
.ar-tag.pre .ar-st { font: 700 10px var(--mono, monospace); letter-spacing: .1em; text-transform: uppercase; padding: 2px 8px; border-radius: 99px; background: #ffffff14; color: var(--fg2); }
