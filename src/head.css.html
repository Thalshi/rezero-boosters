<title>Boosters Re Zéro : LoL</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Zen+Kaku+Gothic+New:wght@500;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: a booster counter at night — header with your stock, then three rooms: open boosters, fill the album, review your pulls. Single dark look on purpose. */
:root {
  --bg: #0e0d12;
  --panel: #17151e;
  --panel-2: #1f1c28;
  --line: #2c2838;
  --ink: #f3efe8;
  --muted: #9b94a8;
  --accent: #ff5a36;
  --sand: #e9c496;
  --r-c: #9aa0ab;
  --r-pc: #5fc77a;
  --r-r: #3d9bff;
  --r-e: #b26bff;
  --r-l: #ffb02e;
  --r-m: #ff4d8d;
  --font-display: "Unbounded", "Arial Black", system-ui, sans-serif;
  --font-body: "Zen Kaku Gothic New", "Hiragino Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 10px 32px;
  -webkit-tap-highlight-color: transparent;
}
.app { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
button { font: inherit; color: inherit; }
button:focus-visible, [data-card]:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }

/* Header */
.bar { display: flex; align-items: center; gap: 10px; }
.logo { width: 38px; height: 38px; border-radius: 10px; background: var(--accent); color: var(--bg); display: grid; place-items: center; font: 900 20px var(--font-body); transform: rotate(-4deg); box-shadow: 0 0 0 3px var(--bg), 0 0 0 4px var(--sand); flex: none; }
.brand { font: 700 .95rem var(--font-display); line-height: 1.1; min-width: 0; }
.brand small { display: block; font: 500 .7rem var(--font-mono); color: var(--muted); letter-spacing: .04em; }
.wallet { margin-left: auto; display: flex; align-items: center; gap: 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 7px 12px; font: 500 .82rem var(--font-mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
.wallet .gauge { width: 30px; height: 6px; border-radius: 9px; background: var(--line); overflow: hidden; }
.wallet .gauge i { display: block; height: 100%; background: var(--accent); }
.wallet .chakra { color: #7fd8ff; }
.tabs { display: flex; gap: 4px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 4px; }
.tab { flex: 1; background: none; border: 0; border-radius: 10px; padding: 9px 4px; font: 700 .78rem var(--font-display); color: var(--muted); cursor: pointer; letter-spacing: .02em; }
.tab[aria-selected="true"] { background: var(--ink); color: var(--bg); }

/* Common */
.eyebrow { font: 500 .72rem var(--font-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--accent); }
.eyebrow span { color: var(--muted); }
h2 { font: 900 1.9rem/1.05 var(--font-display); margin: 0; text-wrap: balance; letter-spacing: -.01em; }
h3 { font: 700 1rem var(--font-display); margin: 0; }
.muted { color: var(--muted); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; border: 0; border-radius: 999px; padding: 13px 22px; font: 700 .92rem var(--font-display); cursor: pointer; background: var(--accent); color: #1a0c08; transition: transform .12s, filter .12s; }
.btn:hover:not(:disabled) { filter: brightness(1.08); }
.btn:active:not(:disabled) { transform: scale(.97); }
.btn:disabled { background: var(--line); color: var(--muted); cursor: default; }
.btn .n { background: var(--bg); color: var(--ink); border-radius: 999px; min-width: 28px; height: 28px; display: grid; place-items: center; font: 500 .8rem var(--font-mono); padding: 0 6px; }
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 20px; padding: 18px; }

/* Hero */
.hero { position: relative; overflow: hidden; border-color: #3a2a26; background: radial-gradient(90% 70% at 50% 25%, #3a1d14 0%, var(--panel) 65%); display: flex; flex-direction: column; gap: 12px; }
.fan { position: relative; height: 210px; display: flex; justify-content: center; align-items: flex-end; margin-bottom: 6px; }
.fan .kc { position: absolute; bottom: 0; --w: 128px; }
.fan .kc:nth-child(1) { transform: translateX(-78%) rotate(-11deg); }
.fan .kc:nth-child(2) { transform: translateY(-14px); z-index: 2; }
.fan .kc:nth-child(3) { transform: translateX(78%) rotate(11deg); }
.next { font: 500 .78rem var(--font-mono); color: var(--muted); }
.tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.tile { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 10px 8px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; min-width: 0; }
.tile .k { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; font: 700 15px var(--font-body); border: 1px solid currentColor; }
.tile b { font: 700 1rem var(--font-display); font-variant-numeric: tabular-nums; }
.tile span { font-size: .68rem; color: var(--muted); font-weight: 700; line-height: 1.2; }
@media (max-width: 420px) { .tiles { grid-template-columns: repeat(2, 1fr); } }
.odds { display: grid; grid-template-columns: auto 1fr auto; gap: 8px 12px; align-items: center; font-size: .85rem; font-weight: 700; }
.odds .meter { height: 6px; border-radius: 9px; background: var(--line); overflow: hidden; }
.odds .meter i { display: block; height: 100%; border-radius: 9px; }
.odds .pct { font: 500 .8rem var(--font-mono); font-variant-numeric: tabular-nums; text-align: right; }
.shop { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }

/* Card */
.kc {
  --w: 132px; --rc: var(--r-c);
  position: relative; width: var(--w); max-width: 100%; aspect-ratio: 5 / 7; border-radius: calc(var(--w) * .07);
  border: 2px solid var(--rc); background: #000; overflow: hidden; flex: none; isolation: isolate;
  box-shadow: 0 10px 24px rgba(0,0,0,.45);
  font-size: calc(var(--w) * .085);
}
.kc.r-pc { --rc: var(--r-pc); } .kc.r-r { --rc: var(--r-r); } .kc.r-e { --rc: var(--r-e); } .kc.r-l { --rc: var(--r-l); } .kc.r-m { --rc: var(--r-m); }
.kc.r-e { box-shadow: 0 10px 24px rgba(0,0,0,.45), 0 0 18px rgba(178,107,255,.35); }
.kc.r-l { box-shadow: 0 10px 24px rgba(0,0,0,.45), 0 0 24px rgba(255,176,46,.45); }
.kc.r-m { border-color: transparent; box-shadow: 0 10px 24px rgba(0,0,0,.45), 0 0 28px rgba(255,77,141,.5); }
.kc.r-m::before { content: ""; position: absolute; inset: -60%; z-index: -1; background: conic-gradient(#ff4d8d, #ffb02e, #7dffb4, #3d9bff, #b26bff, #ff4d8d); animation: spin 4s linear infinite; }
.kc .art { position: absolute; inset: 0; overflow: hidden; border-radius: inherit; z-index: 0; }
.kc.r-m { border: 0; }
.kc.r-m .art, .kc.r-m .shade { inset: 3px; border-radius: calc(var(--w) * .06); }
.kc .layer { position: absolute; inset: 0; background-size: cover; background-repeat: no-repeat; background-position: var(--pos, 50% 30%); transform: scale(var(--zoom, 1)); transform-origin: var(--pos, 50% 30%); }
.kc .ghost { mix-blend-mode: screen; opacity: .38; filter: hue-rotate(190deg) saturate(2.2) brightness(1.1); animation: ghost 2.4s ease-in-out infinite; }
.kc .ghost.g2 { opacity: .22; animation-delay: -1.2s; filter: hue-rotate(260deg) saturate(2.4); }
.kc .rings { position: absolute; inset: 0; width: 100%; height: 100%; mix-blend-mode: screen; animation: pulseR 2.2s ease-in-out infinite; }
.kc .tint { position: absolute; inset: 0; mix-blend-mode: color; opacity: .45; }
.kc .glint { position: absolute; width: 18%; aspect-ratio: 1; transform: translate(-50%, -50%); background: radial-gradient(circle, #fff 0 8%, transparent 9%), linear-gradient(90deg, transparent 46%, #fff 50%, transparent 54%), linear-gradient(0deg, transparent 46%, #fff 50%, transparent 54%); mix-blend-mode: screen; animation: glint 2.8s ease-in-out infinite; }
.kc .shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,.55) 0%, transparent 22%, transparent 55%, rgba(8,6,12,.92) 100%); }
.kc .top { position: absolute; top: 6%; left: 7%; right: 7%; display: flex; justify-content: space-between; align-items: center; gap: 4px; z-index: 2; }
.kc .rar { font: 500 .62em var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: #fff; background: color-mix(in srgb, var(--rc) 70%, #000); padding: .2em .55em; border-radius: 99px; white-space: nowrap; }
.kc .kanji { font: 700 1.05em var(--font-body); color: var(--rc); text-shadow: 0 1px 4px #000; }
.kc .foot { position: absolute; left: 8%; right: 8%; bottom: 6%; z-index: 2; display: flex; flex-direction: column; gap: .1em; }
.kc .foot b { font: 900 1.25em/1.05 var(--font-display); letter-spacing: -.01em; color: #fff; }
.kc .foot span { font-size: .78em; font-weight: 700; color: rgba(255,255,255,.75); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kc.gold { border-color: var(--sand); box-shadow: 0 10px 24px rgba(0,0,0,.45), 0 0 0 1px rgba(255,255,255,.2), 0 0 26px rgba(233,196,150,.55); }
.kc.gold .art::after { content: ""; position: absolute; inset: -50%; background: linear-gradient(115deg, transparent 35%, rgba(255,226,170,.55) 48%, rgba(255,255,255,.7) 50%, rgba(255,226,170,.55) 52%, transparent 65%); mix-blend-mode: screen; animation: sheen 3s linear infinite; }
.kc.gold .base { filter: sepia(.35) saturate(1.3) brightness(1.05); }
.kc.gold .rar { background: linear-gradient(90deg, #b8894f, var(--sand)); color: #2a1a08; }
.badge { position: absolute; z-index: 3; top: -1px; right: -1px; font: 500 .62em var(--font-mono); padding: .35em .6em; border-radius: 0 0 0 .8em; background: var(--ink); color: var(--bg); }
.badge.new { background: var(--accent); color: #1a0c08; font-weight: 500; }
.kc.locked { background: var(--panel-2); border: 2px dashed color-mix(in srgb, var(--rc) 55%, transparent); box-shadow: none; }
.kc.locked .layer { filter: brightness(0) ; opacity: .5; }
.kc.locked .foot b { color: var(--muted); }
.kc.locked .shade { background: linear-gradient(180deg, transparent 50%, rgba(8,6,12,.8)); }
[data-card] { cursor: pointer; }

/* Booster opening */
.stage { display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 8px 0; text-align: center; }
.pack {
  position: relative; width: 200px; aspect-ratio: 5 / 7.4; border: 0; border-radius: 12px 12px 18px 18px; cursor: pointer; overflow: hidden;
  background: linear-gradient(160deg, #ff5a36 0%, #7a1f3d 55%, #24153a 100%); box-shadow: 0 18px 40px rgba(255,90,54,.3), inset 0 0 0 2px rgba(255,255,255,.18);
  display: flex; flex-direction: column; justify-content: flex-end; padding: 16px; color: #fff; text-align: left;
}
.pack::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 14px; background: repeating-linear-gradient(90deg, rgba(255,255,255,.4) 0 7px, transparent 7px 12px); }
.pack .pk-k { position: absolute; top: 24px; right: 14px; font: 900 64px/1 var(--font-body); color: rgba(255,255,255,.16); writing-mode: vertical-rl; }
.pack .pk-faces { position: absolute; inset: 30px 30px 90px 16px; display: flex; gap: 6px; }
.pack .pk-faces i { flex: 1; position: relative; overflow: hidden; border-radius: 10px; box-shadow: 0 6px 14px rgba(0,0,0,.4); }
.pack .pk-faces em { position: absolute; inset: 0; background-size: cover; background-position: 50% 25%; }
.pack .pk-faces i:first-child { transform: rotate(-5deg); } .pack .pk-faces i:last-child { transform: rotate(5deg) translateY(10px); }
.pack b { font: 900 1.3rem/1 var(--font-display); position: relative; }
.pack small { font: 500 .7rem var(--font-mono); letter-spacing: .1em; opacity: .85; position: relative; margin-top: 4px; }
.pack.tear { animation: tear .6s ease-in forwards; }
.reveal-card { position: relative; width: min(64vw, 250px); aspect-ratio: 5 / 7; perspective: 1100px; background: none; border: 0; padding: 0; cursor: pointer; }
.reveal-card .in { position: absolute; inset: 0; transition: transform .7s cubic-bezier(.3,1.35,.5,1); transform-style: preserve-3d; }
.reveal-card.on .in { transform: rotateY(180deg); }
.reveal-card .face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; display: grid; place-items: center; }
.reveal-card .front { transform: rotateY(180deg); }
.reveal-card .front .kc { --w: min(64vw, 250px); }
.cardback { width: 100%; height: 100%; border-radius: 18px; border: 2px solid var(--rc, var(--line)); background: radial-gradient(circle at 50% 45%, #2a1720, #120f18 70%); display: grid; place-items: center; font: 900 72px var(--font-body); color: var(--accent); box-shadow: 0 0 var(--glow, 0px) var(--rc, transparent); }
.cardback.r-r { --rc: var(--r-r); --glow: 20px; } .cardback.r-e { --rc: var(--r-e); --glow: 34px; animation: throb 1.1s ease-in-out infinite; }
.cardback.r-l { --rc: var(--r-l); --glow: 44px; animation: throb .8s ease-in-out infinite; } .cardback.r-m { --rc: var(--r-m); --glow: 56px; animation: throb .6s ease-in-out infinite; }
.dots { display: flex; gap: 6px; }
.dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
.dots i.on { background: var(--accent); }
.hint { font: 500 .78rem var(--font-mono); color: var(--muted); }
.summary { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 12px; width: 100%; justify-items: center; }
.summary .kc { --w: 104px; }
.burst { position: absolute; inset: -30%; border-radius: 50%; background: radial-gradient(circle, color-mix(in srgb, var(--rc) 60%, transparent), transparent 60%); pointer-events: none; animation: burst .9s ease-out forwards; }

/* Album */
.album-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
.progress { height: 8px; border-radius: 9px; background: var(--line); overflow: hidden; }
.progress i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--sand)); transition: width .4s; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, 112px); gap: 16px 10px; justify-content: center; }
.grid .kc { --w: 112px; }
.grid .cell { width: 112px; display: flex; flex-direction: column; gap: 6px; }
.grid .cell .meta { display: flex; justify-content: space-between; font: 500 .68rem var(--font-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.note { font-size: .82rem; color: var(--muted); font-weight: 700; line-height: 1.5; margin: 0; }

/* Pulls */
.pulls { display: flex; flex-direction: column; gap: 8px; }
.pull { display: flex; align-items: center; gap: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 8px 12px 8px 8px; }
.pull .kc { --w: 44px; border-width: 1.5px; box-shadow: none; font-size: 0; }
.pull .who { flex: 1; min-width: 0; }
.pull .who b { font: 700 .88rem var(--font-display); display: block; }
.pull .who span { font-size: .78rem; color: var(--muted); font-weight: 700; }
.pull time { font: 500 .72rem var(--font-mono); color: var(--muted); white-space: nowrap; }
.chip { font: 500 .66rem var(--font-mono); letter-spacing: .06em; text-transform: uppercase; padding: 2px 8px; border-radius: 99px; color: #fff; }
.statline { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.empty { text-align: center; padding: 26px 10px; color: var(--muted); font-weight: 700; }

/* Fiche */
.overlay { position: fixed; inset: 0; z-index: 30; background: rgba(8,7,12,.86); display: grid; place-items: center; overflow-y: auto; padding: 20px max(16px, env(safe-area-inset-right, 0px)) 20px max(16px, env(safe-area-inset-left, 0px)); }
.sheet { width: 100%; max-width: 440px; background: var(--panel); border: 1px solid var(--line); border-radius: 22px; padding: 20px; display: flex; flex-direction: column; gap: 14px; align-items: center; }
.sheet .kc { --w: min(56vw, 220px); }
.facts { width: 100%; display: grid; grid-template-columns: auto 1fr; gap: 8px 14px; font-size: .88rem; margin: 0; }
.facts dt { font: 500 .72rem var(--font-mono); color: var(--muted); text-transform: uppercase; letter-spacing: .08em; padding-top: 2px; }
.facts dd { margin: 0; font-weight: 700; }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); font-weight: 700; padding: 10px 16px; border-radius: 999px; z-index: 40; font-size: .88rem; max-width: calc(100% - 32px); text-align: center; }

@keyframes spin { to { transform: rotate(1turn); } }
@keyframes ghost { 0%,100% { translate: -7% 0; } 50% { translate: 7% 0; } }
@keyframes pulseR { 50% { opacity: .45; } }
@keyframes glint { 0%, 70%, 100% { opacity: 0; scale: .4; } 80% { opacity: 1; scale: 1; } }
@keyframes sheen { from { transform: translateX(-40%); } to { transform: translateX(40%); } }
@keyframes tear { 40% { transform: rotate(-3deg) scale(1.05); } 70% { transform: rotate(3deg) scale(1.08); } to { transform: scale(1.35); opacity: 0; } }
@keyframes throb { 50% { box-shadow: 0 0 6px var(--rc); } }
@keyframes burst { from { opacity: 1; transform: scale(.5); } to { opacity: 0; transform: scale(1.3); } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
